<!-- Estilo común (22-sep-2026, traído de la 1217): tokens de color,
     Montserrat desde ./fuentes/ (nunca del CDN: sin señal dibujaba con otra
     letra) y el encabezado `.barra`. -->
<link rel="stylesheet" href="./estilo.css">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Montserrat',sans-serif; background:var(--fondo); color:var(--tinta); padding-bottom:40px; }

  main { padding:16px 16px 0; max-width:560px; margin:0 auto; }
  .nota { font-size:11.5px; color:var(--tinta-2); background:var(--superficie); border:1px solid var(--linea); border-radius:10px;
    padding:10px 12px; margin-bottom:16px; line-height:1.45; }

  .grupo-titulo { font-size:11px; font-weight:700; color:var(--tinta-3); text-transform:uppercase;
    letter-spacing:1px; margin:18px 4px 8px; }

  /* Sin raya de color (22-sep-2026): era turquesa, que ni es de Odemás ni
     decía nada. El color de esta pantalla es el de los semáforos, y nada más. */
  .card { background:var(--superficie); border:1px solid var(--linea); border-radius:var(--r-md);

  .card .top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }

  .venta-row { display:flex; align-items:baseline; gap:8px; margin-top:10px; }
  /* En tinta, no en rojo (estilo.css, regla 1): la venta informa. En rojo

  .venta { font-size:var(--t-xl); font-weight:800; color:var(--tinta); font-variant-numeric:tabular-nums; }
  .venta-lbl { font-size:10.5px; color:var(--tinta-3); font-weight:600; }
  /* Los semáforos son los del KPI y NO cambiaron: alcance ≥100 / ≥70 y
     extracobertura ≥25 / ≥15. El ámbar va en --atencion: el naranja de marca
     sobre su tinte daba 2.9:1. */
  .badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--fondo); color:var(--tinta-2); }
  .badge.ok { background:var(--ok-bg); color:var(--ok); }

  .badge.bad { background:var(--alerta-bg); color:var(--alerta); }
  .meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; }

  .extra { margin-top:10px; padding-top:10px; border-top:1px dashed var(--linea); }
  .extra-head { font-size:11px; font-weight:800; color:var(--tinta-2); text-transform:uppercase;

  .extra-grid { display:flex; align-items:center; gap:14px; }
  .extra-pct { font-size:22px; font-weight:800; }
  .extra-det { font-size:11.5px; color:var(--tinta-2); line-height:1.4; }
  .extra-none { font-size:12px; color:var(--tinta-3); }

  footer { text-align:center; font-size:10px; color:var(--tinta-3); margin-top:24px; padding:0 16px; }

<body>
<script src="./continuidad.js"></script>

<!-- supabase-js (20-sep-2026). Aquí NO se usa para leer datos —eso sigue yendo
     por `fetch` a la RPC— sino para una sola cosa: saber si quien abre esta
     pantalla tiene una sesión de correo y contraseña, y poder preguntarle al
     SERVIDOR si manda en esta tienda. Hace falta porque el gerente DUEÑO entra
     con el correo de la tienda y `index.html` no le deja ficha de empleado
     (ver el `else removeItem` de doLogin): sin esto sería indistinguible de un
     desconocido y se quedaría fuera de las comisiones de su propio equipo.
     Si el CDN no responde, no pasa nada grave: se sigue sin sesión, que es el
     lado seguro — sin comisiones, no con las de todos. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>


<header class="barra">
  <a href="index.html" class="barra-volver" title="Menú" aria-label="Volver al menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <img class="barra-logo" src="logo_odemas.png" alt="Odemás">
  <div class="barra-txt">
    <!-- «y Extracoberturas» se fue del título: lo partía en dos renglones, y
         la sección de cada tarjeta ya lo dice. -->
    <h1 class="barra-titulo">Comisiones</h1>
    <p class="barra-sub" id="storeSub">—</p>
  </div>

<main>
  <div class="nota">📊 Datos oficiales de <b>Sonar by Office Depot</b>. <b>Venta</b> = periodo <span id="pComis">—</span>. <b>Extracobertura</b> = periodo <span id="pGar">—</span>. Se actualiza cuando el gerente comparte captura nueva del reporte.</div>
  <div id="app"></div>

<!-- comisiones_datos.js se elimino el 1-ago-2026: este repo es publico y ese
     archivo traia nombre completo, venta individual, alcance y monto de
     comision de cada persona. Los datos vienen de la nube (modo=comisiones). -->
<script>
/* ====== Sesión de tienda: sin odemas_store no hay datos que mostrar ====== */
const _storeConfig = (function(){ try{ return JSON.parse(localStorage.getItem('odemas_store')||'null'); }catch(e){ return null; } })();

/* Aquí iba el aviso de "tu sesión es de antes del candado del 1-ago-2026", que
   se pintaba cuando la sesión no traía `gas_token`. Esta copia nace despues de
   aquello y no hay sesiones viejas que avisar.

   Ojo, que el nombre engaña: `gas_token` YA NO es el token del Apps Script. Es
   la credencial de escritura de Supabase —`escritura_ok_` la compara contra
   `tiendas.gas_token` y la exigen 36 funciones—, asi que se queda aunque el
   Apps Script no exista.

   20-sep-2026: esta pantalla SOLO LEE, pero desde la firma nueva de
   `comisiones_lista` tambien lo necesita — es lo que dice de que tienda se
   piden las comisiones. Aun asi no se corta la entrada si falta: sin token la
   nube responde vacio y el aviso de "la nube no contesto" ya cubre el caso,
   mientras que cortar aqui dejaria la pantalla en blanco sin explicar nada. */

if(!_storeConfig || !_storeConfig.store_id){
  // Se avisa a continuidad.js de que esta salida es voluntaria. Hoy el menú ya
  // no reanudaría —sin `odemas_store` no reanuda nada—, pero eso es una casualidad
  // de dos condiciones que coinciden, y el día que una cambie esto sería un
  // bucle: comisiones → menú → comisiones.
  if(window.HES_salirAlMenu) window.HES_salirAlMenu();
  location.replace('index.html');
  throw new Error('Sin sesión de tienda — redirigiendo a login');
}
const _storeId = _storeConfig.store_id;
document.getElementById('storeSub').textContent = 'HES ' + _storeId + ' · ' + (_storeConfig.nombre || 'Odemás');
document.getElementById('footerTxt').textContent = 'Odemás · Grupo Gigante — uso interno HES ' + _storeId;

/* ── Quién está mirando (20-sep-2026, portado de la 1217) ─────────────────
   Hasta hoy esta pantalla no se lo preguntaba: pintaba el equipo entero a
   quien la abriera. Ahora cada quien ve lo suyo y gerente y subgerente ven a
   todos, y quien decide es el SERVIDOR — aquí solo se dice quién eres.

   ⚠️ MISMA REGLA DE PUESTOS QUE `tablero.html` y `horarios.html`, y por tercera
   vez escrita aparte: estas pantallas no comparten ningún archivo de JS.
   Que las tres listas no se separen lo vigila `r_puestos_gestion`.

   ⚠️ Esto es la red del CLIENTE, no el filtro del servidor. `comisiones_lista`
   sigue devolviendo el equipo entero a quien traiga el token de la tienda: el
   dato VIAJA al teléfono aunque la pantalla no lo enseñe. Para cerrarlo de
   verdad falta pegar el SQL del filtro por persona. */
const PUESTOS_GESTION_C = ['gerente', 'subgerente'];
function esPuestoDeGestion_(puesto){
  const p = String(puesto || '').toLowerCase()
              .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'), '').trim();
  return PUESTOS_GESTION_C.some(function(x){ return p.indexOf(x) === 0; });
}

let _yo = null;
// Ficha ilegible: se sigue sin identidad, y sin identidad esta pantalla NO
// enseña comisiones — se pide entrar con el número. Fallar hacia «no sé quién
// eres» es lo correcto aquí; lo peligroso sería caer hacia «enséñalo todo».
try{ _yo = JSON.parse(localStorage.getItem('odemas_empleado')||'null'); }catch(e){}
const MI_EMPNO = (_yo && _yo.empno) ? String(_yo.empno) : '';

/* La credencial de escritura de la tienda. El nombre engaña —ya no es del Apps
   Script—: `escritura_ok_` la compara contra `tiendas.gas_token`, y la firma
   nueva de `comisiones_lista` la exige a todos, también a quien manda. Es lo
   que dice DE QUÉ TIENDA se están pidiendo las comisiones. */
const GAS_TOKEN = _storeConfig.gas_token || '';

// El token de la sesión, para que la RPC viaje firmada. Vacío = se pregunta con
// la clave publicable, y entonces `admin_de` responde que no.
let _tokenSesion = '';

/* ⚠️ `let`, no `const`: hay una TERCERA forma de mandar aquí y no se sabe al
   arrancar, hay que preguntarla.

   Las dos que ya había van por la ficha de empleado. La tercera es el gerente
   DUEÑO de la tienda, que entra con el correo de la tienda: su cuenta vive en
   `tiendas.user_id` y no en `empleados`, así que `index.html` no le guarda
   `odemas_empleado` (ver el `else removeItem` de doLogin) y aquí llegaría sin
   número y sin puesto — o sea, indistinguible de un desconocido. Sin esto, el
   gerente vería «entra con tu número de empleado» en su propia tienda.

   NO vale caer en `odemas_role`, que sería más corto: el rol lo escribe el
   navegador y esto es el sueldo del equipo. Se le pregunta al servidor
   —`admin_de`, la misma que usan Admin y el horario— y él contesta. */
let VEO_TODAS = esPuestoDeGestion_(_yo && _yo.puesto);

/* Mientras no se sepa, esta pantalla no es «de nadie»: está preguntando. Solo
   se pregunta cuando hace falta —sin ficha y sin puesto de gestión—, así que
   para todo el que entra con su número esto vale `false` y no cambia nada: ni
   una llamada de más, ni un milisegundo de espera. */
const SESION_POR_RESOLVER = !VEO_TODAS && !MI_EMPNO;
let _comprobandoSesion = SESION_POR_RESOLVER;

/* ====== Datos: caché local de esta tienda -> Supabase ====== */
const COMISKEY = 'hes' + _storeId + '_comisiones';
let D = { empleados: [] };
// Cache ilegible: se arranca vacio y la nube lo llena; si tampoco responde,
// avisoNube() lo dice en pantalla.
try{ const c = JSON.parse(localStorage.getItem(COMISKEY)||'null'); if(c && Array.isArray(c.empleados)) D = c; }catch(e){}

/* La caché del teléfono trae el equipo entero, guardado antes de que esto
   filtrara. Sin esta línea, el asesor seguiría abriendo la app y viendo el
   sueldo de sus compañeros —el dato ya está en SU teléfono— hasta que la nube
   contestara, y para siempre si no hay red.

   Lo que había guardado se conserva SOLO mientras se pregunta al servidor quién
   eres: si resulta que mandas, es tu propia caché y se te devuelve entera —así
   el gerente sin señal sigue viendo al equipo—; si resulta que no, se tira y se
   reescribe filtrada. */
const _cacheCruda = D.empleados;
D.empleados = soloLoMio_(D.empleados);
// Mientras se pregunta no se reescribe: borrarla ahora sería tirar la del
// gerente por una respuesta que aún no ha llegado.
if(!VEO_TODAS && !SESION_POR_RESOLVER){ guardarCache_(); }
function guardarCache_(){
  // Callar es correcto: sin espacio para guardar se pierde la limpieza de la
  // caché, no el filtro — lo que se pinta ya salió de `soloLoMio_`. Se reintenta
  // en la próxima apertura, y avisar aquí no le daría a nadie nada que hacer.
  try{ localStorage.setItem(COMISKEY, JSON.stringify(D)); }catch(e){}
}

function soloLoMio_(lista){
  if(VEO_TODAS) return Array.isArray(lista) ? lista : [];
  if(!Array.isArray(lista)) return [];
  return lista.filter(function(e){ return String(e.empNo || '') === MI_EMPNO; });
}

function pintarPeriodos(){
  document.getElementById('updated').textContent = D.actualizado || '—';
  document.getElementById('pComis').textContent = D.periodoComisiones || '—';
  document.getElementById('pGar').textContent = D.periodoGarantias || '—';
}
pintarPeriodos();

function money(n){
  return '$' + Number(n||0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
/* Lo que llega de la base va a innerHTML: se escapa (22-sep-2026). */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nombreCorto(n){ const p=(n||'').split(' '); return p[0]+(p[1]?' '+p[1]:''); }

function alcanceBadge(pct){
  if (pct == null) return '';
  const cls = pct >= 100 ? 'ok' : pct >= 70 ? 'warn' : 'bad';
  return `<span class="badge ${cls}">${pct}% de meta</span>`;
}

function garantiaColor(pct){
  if (pct >= 25) return 'var(--ok)';
  if (pct >= 15) return 'var(--atencion)';
  return 'var(--alerta)';
}

function cardEmpleado(e){
  const extra = (e.garantiaPct == null)
    ? `<div class="extra"><div class="extra-head">🛡️ Extracobertura</div><div class="extra-none">Sin datos en este periodo.</div></div>`
    : `<div class="extra">
        <div class="extra-head">🛡️ Extracobertura</div>
        <div class="extra-grid">
          <div class="extra-pct" style="color:${garantiaColor(e.garantiaPct)}">${e.garantiaPct}%</div>
          <div class="extra-det">${e.garantiaPzas} de ${e.garantiaElegible} piezas elegibles<br>${money(e.garantiaMonto)} en extracobertura</div>
        </div>
      </div>`;
  return `<div class="card">
    <div class="top">
      <div><h3>${esc(e.nombre)}</h3><div class="puesto">${esc(e.puesto)}</div></div>
    </div>
    <div class="venta-row"><span class="venta">${money(e.venta)}</span><span class="venta-lbl">venta para comisión</span></div>
    <div class="meta">${alcanceBadge(e.alcance)}<span class="badge">${e.pptoPct}% de aplicación</span></div>
    ${extra}
  </div>`;
}

function render(){
  const list = (D.empleados||[]).slice().sort((a,b)=> (b.venta||0)-(a.venta||0));
  /* Todavía se le está preguntando al servidor si quien mira manda aquí. No es
     lo mismo que «no sé quién eres»: decirle al gerente que entre con su número
     y cambiárselo medio segundo después por el equipo entero es un parpadeo que
     se lee como un fallo. Dura lo que tarde `admin_de`, y si el CDN no cargó
     se resuelve solo con el DOMContentLoaded. */
  if(_comprobandoSesion){
    document.getElementById('app').innerHTML =
      '<div class="nota">Comprobando tu sesión…</div>';
    return;
  }
  if(!VEO_TODAS && !MI_EMPNO){
    document.getElementById('app').innerHTML =
      '<div class="nota">Para ver tu comisión, entra con <b>tu número de empleado</b>. '
      + 'Esta pantalla es personal: cada quien ve la suya.<br><br>'
      + '<a href="index.html" style="color:var(--rojo);font-weight:700">Volver a entrar</a></div>';
    return;
  }
  if(!list.length){
    document.getElementById('app').innerHTML = VEO_TODAS
      ? '<div class="nota">Aún no hay comisiones cargadas para esta tienda. Pide al gerente que las suba.</div>'
      /* Para el asesor, «no hay para esta tienda» sería falso el mes en que las
         hay para los demás y no para él: lo que pasa es que su número no está en
         el reporte, y eso lo arregla el gerente, no esperar. */
      : '<div class="nota">Todavía no aparece tu comisión de este periodo. '
        + 'Si tus compañeros ya ven la suya, pídele al gerente que revise tu número '
        + 'en el reporte.</div>';
    return;
  }
  document.getElementById('app').innerHTML =
    (VEO_TODAS
      ? `<div class="grupo-titulo">👥 Equipo — ${list.length} integrante${list.length!==1?'s':''}</div>`
      : `<div class="grupo-titulo">💰 Tu comisión</div>`) +
    list.map(cardEmpleado).join('');
}
render();

/* Aviso visible cuando la nube no responde. Sin esto la página se queda con lo
   guardado en el teléfono y parece al día, que es justo lo que pasó al cerrar
   el Apps Script: se veían comisiones de julio como si fueran de agosto. */
function avisoNube(msg){
  let el = document.getElementById('avisoNube');
  if(!el){
    el = document.createElement('div');
    el.id = 'avisoNube';
    el.style.cssText = 'margin:12px 16px;padding:10px 12px;border-radius:10px;'
      + 'background:var(--atencion-bg);border-left:3px solid var(--naranja);color:var(--atencion);'
      + 'font-size:12.5px;line-height:1.45;font-weight:600';
    const m = document.querySelector('main');
    if(m) m.insertBefore(el, m.firstChild); else document.body.appendChild(el);
  }
  el.textContent = '⚠ ' + msg;
}

/* Las comisiones se leen de Supabase, que es la única fuente. Esta pantalla la
   mira el equipo para saber cuánto lleva ganado.

   NO devuelve `null` cuando algo sale mal: devuelve el MOTIVO. Antes había
   cuatro formas distintas de fallar —rechazo, respuesta vacía, timeout y sin
   red— y las cuatro daban `null`, que se tapaba cayendo al Apps Script. Sin esa
   caída, un `null` mudo dejaría la pantalla con lo guardado en el teléfono y
   con aspecto de estar al día: es exactamente lo que pasó al cerrar la hoja, y
   se veían comisiones de julio como si fueran de agosto. */
const SB_URL_CO = 'https://ecuqtqxmdehzbbsmlxrh.supabase.co';
const SB_KEY_CO = 'sb_publishable_ANNakHYo8KtRhKHcU6XiyQ_DRRXMlce';

/* Una sola llamada a la RPC, con el cuerpo que se le pase. Separada para poder
   intentar la firma nueva y caer a la vieja sin repetir la fontanería. */
async function _rpcComisiones(cuerpo){
  const ctl = new AbortController();
  const t = setTimeout(function(){ ctl.abort(); }, 8000);
  try{
    /* Con sesión se firma con ella; sin sesión, con la clave publicable. Es lo
       único que separa «soy el gerente de esta tienda» de «traigo la clave que
       viene dentro del HTML» — y `admin_de`, del lado del servidor, lee ese
       JWT. Mandar siempre la clave publicable dejaría al dueño sin ver nada. */
    const r = await fetch(SB_URL_CO + '/rest/v1/rpc/comisiones_lista', {
      method:'POST', signal: ctl.signal,
      headers:{ apikey:SB_KEY_CO, Authorization:'Bearer '+(_tokenSesion || SB_KEY_CO), 'Content-Type':'application/json' },
      body: JSON.stringify(cuerpo)
    });
    if(!r.ok) return { err:'rechazo', codigo:r.status };
    const filas = await r.json();
    return { filas: Array.isArray(filas) ? filas : [] };
  }catch(e){
    // El timeout se distingue del corte de red: uno se reintenta solo al volver
    // a entrar, el otro no depende de la señal del teléfono.
    return { err: (e && e.name === 'AbortError') ? 'lento' : 'red' };
  }
  finally{ clearTimeout(t); }
}

async function comisionesDeSupabase(){
  if(!_storeId) return { err:'sin_tienda' };
  try{
    /* Primero la versión que filtra EN EL SERVIDOR. Mientras
       `supabase_comisiones_privadas.sql` no esté pegado, esa firma no existe y
       PostgREST responde 404: entonces se llama a la vieja, que devuelve el
       equipo entero, y el filtro lo hace `soloLoMio_` aquí abajo. La pantalla
       funciona en los dos mundos, así que da igual si se publica la app antes o
       después de pegar el SQL — pero hasta pegarlo, el dato SIGUE VIAJANDO al
       teléfono aunque no se pinte. */
    let res = await _rpcComisiones({ p_store: String(_storeId),
                                     p_token: GAS_TOKEN,
                                     p_empno: MI_EMPNO });
    /* Solo se reintenta con la firma vieja si la nueva NO EXISTE (404). Un 403
       —token malo, o «no sé quién eres»— es una respuesta legítima del filtro y
       reintentar sin argumentos sería saltárselo por la puerta de atrás. */
    if(res.err === 'rechazo' && res.codigo === 404){
      res = await _rpcComisiones({ p_store: String(_storeId) });
    }
    if(res.err) return { err: res.err, codigo: res.codigo };
    const filas = res.filas;
    // Vacío NO es un fallo de conexión: es que nadie ha cargado el reporte de
    // este periodo. Decirlo como "sin conexión" manda a revisar el teléfono
    // cuando lo que falta es que suban el archivo.
    if(!filas.length) return { err:'vacio' };
    // Supabase devuelve filas; esta pantalla espera un objeto.
    return { datos:{
      actualizado: filas[0].actualizado ? String(filas[0].actualizado).slice(0,10) : '',
      periodoComisiones: filas[0].periodo || '',
      periodoGarantias:  filas[0].periodo_gar || '',
      empleados: soloLoMio_(filas.map(function(k){
        return { empNo:k.empno||'', nombre:k.nombre||'', puesto:k.puesto||'',
                 venta:Number(k.venta)||0, pptoPct:Number(k.ppto_pct)||0,
                 alcance:Number(k.alcance)||0,
                 // null NO es 0: "sin dato" y "cero garantías" se ven igual en
                 // pantalla pero significan cosas distintas para quien cobra.
                 garantiaPct: k.gar_pct==null ? null : Number(k.gar_pct),
                 garantiaPzas: k.gar_pzas==null ? null : Number(k.gar_pzas),
                 garantiaElegible: k.gar_elegible==null ? null : Number(k.gar_elegible),
                 garantiaMonto: k.gar_monto==null ? null : Number(k.gar_monto) };
      }))
    }};
  }catch(e){
    // Red de seguridad: el timeout y el corte de señal ya los distingue
    // `_rpcComisiones`. Aquí solo puede caer algo al armar el objeto.
    return { err:'red' };
  }
}

/* Trae la versión más reciente desde Supabase.

   Todos los caminos que no traen datos AVISAN, y cada uno dice lo suyo: no es
   lo mismo que nadie haya subido el reporte del periodo que que el teléfono no
   tenga señal, y mandar a revisar la conexión cuando lo que falta es el archivo
   hace perder el rato a quien lo lea. Ninguno se queda callado: callarse deja
   en pantalla el sueldo del mes pasado con cara de ser el de este. */
// Esperar a supabase-js sin colgar la pantalla si el CDN no llega.
function supaListo_(){
  return new Promise(function(res){
    function ya(){ res((window.supabase && window.supabase.createClient) ? window.supabase : null); }
    if(window.supabase && window.supabase.createClient) return ya();
    if(document.readyState !== 'loading') return ya();
    addEventListener('DOMContentLoaded', ya);
    // El CDN que ni responde ni falla: a los 5 s se sigue sin él.
    setTimeout(ya, 5000);
  });
}

/* ¿Quien mira manda en ESTA tienda? Lo contesta el servidor. Cualquier tropiezo
   —sin CDN, sin sesión, RPC que no está— devuelve `false`, que es el lado
   seguro: se cae al camino del número, no a enseñarlo todo. */
async function confirmarSesion_(){
  try{
    const lib = await supaListo_();
    if(!lib) return false;
    const cli = lib.createClient(SB_URL_CO, SB_KEY_CO);
    const ses = ((await cli.auth.getSession()).data || {}).session;
    if(!ses || !ses.access_token) return false;
    /* Se guarda AUNQUE `admin_de` acabe diciendo que no: el servidor necesita
       el JWT para poder contestar esa misma pregunta cuando se pidan las
       comisiones. Firmar con la clave publicable dejaría al dueño —que no
       tiene ficha de empleado ni número que enseñar— sin ver a su equipo. */
    _tokenSesion = ses.access_token;
    const r = await cli.rpc('admin_de', { p_store_id: String(_storeId) });
    if(r && r.error) console.warn('admin_de no disponible:', r.error.message);
    return !!(r && r.data === true);
  }catch(e){ return false; }
}

async function refreshComisionesCloud(){
  /* Primero, quién mira — y solo si no se sabía ya. Va ANTES de pedir las
     comisiones porque decide qué se puede pintar de lo que vuelva. */
  if(SESION_POR_RESOLVER){
    const manda = await confirmarSesion_();
    _comprobandoSesion = false;
    if(manda){
      // Era su caché: se le devuelve entera mientras llega la nube. Sin esto, el
      // gerente sin señal ve la pantalla vacía teniendo el dato en el teléfono.
      VEO_TODAS = true;
      D.empleados = _cacheCruda;
    }else{
      // No manda: ahora sí se limpia lo que quedó guardado de antes.
      guardarCache_();
    }
    render();
  }

  const r = await comisionesDeSupabase();
  if(r && r.datos){
    D = r.datos;
    localStorage.setItem(COMISKEY, JSON.stringify(D));
    pintarPeriodos();
    render();
    return;
  }
  // Si hay caché, hay que decir que lo que se ve es viejo; sin caché la
  // pantalla está vacía y esa coletilla sobra.
  const hayCache = D && Array.isArray(D.empleados) && D.empleados.length;
  const cola = hayCache ? ' Lo que ves es lo último guardado en este teléfono.' : '';
  const err = (r && r.err) || 'red';
  if(err === 'rechazo')          avisoNube('La nube rechazó la consulta. Vuelve a entrar desde el menú.' + cola);
  else if(err === 'vacio')       avisoNube('Todavía no hay comisiones cargadas de este periodo.' + cola);
  else if(err === 'lento')       avisoNube('La nube tardó demasiado en contestar.' + cola);
  else if(err === 'sin_tienda')  avisoNube('No sé de qué tienda eres. Vuelve a entrar desde el menú.');
  else                           avisoNube('Sin conexión con la nube.' + cola);
}
refreshComisionesCloud();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(()=>{});
}
