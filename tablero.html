<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#D12026">
<title>Tablero del Equipo · HES 1217</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HES 1217">
<style>
  /* Montserrat desde el propio repo, NO del CDN de Google (8-ago-2026).
     En la tienda la señal falla, y con el CDN caído el tablero se dibujaba con
     la letra por defecto del sistema: los precios cambiaban de ancho, las
     tarjetas se descuadraban y nadie sabía por qué. Es la misma razón por la
     que spec-cards la lleva dentro desde julio.
     `swap` y no `block`: aquí importa más ver el precio ya —aunque sea un
     instante con otra letra— que esperar a que cargue. */
  @font-face{
    font-family:'Montserrat';
    src:url('./fuentes/Montserrat.woff2') format('woff2');
    font-weight:400 800; font-display:swap;
  }
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --rojo:#D12026; --naranja:#F37021; --azul:#336BB4; --verde:#1a8c4e;
    --gris:#777; --linea:#ececec; --bg:#f6f6f7;

    /* ---- Sistema visual (8-ago-2026) ----
       Antes había 20 tamaños de letra distintos (de 8 a 15 px) y 8 radios de
       esquina conviviendo. Con todo pesando casi lo mismo, nada destacaba: el
       precio se leía igual que la fecha de vigencia. Estos tokens son la escala;
       lo nuevo se construye con ellos. */
    --t-xs:10.5px;   /* referencias, SKU al pie */
    --t-sm:11.5px;   /* etiquetas y botones secundarios */
    --t-md:13px;     /* texto normal */
    --t-lg:14px;     /* título de producto */
    --t-xl:19px;     /* número de piezas */
    --t-2xl:27px;    /* precio */

    --r-sm:9px;      /* pastillas y botones */
    --r-md:14px;     /* tarjetas */
    --r-pill:999px;

    /* Dos sombras y ninguna más. La suave da relieve al contenido; la marcada
       es solo para lo que flota sobre la página. */
    --sombra:0 1px 2px rgba(34,27,26,.04), 0 3px 10px rgba(34,27,26,.05);
    --sombra-alta:0 8px 28px rgba(34,27,26,.14);

    --mono:ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace;

    /* Colores por ESTADO de existencia. Son semánticos: no decoran, dicen qué
       se puede hacer con el producto. El azul de "se trae de otra tienda" es
       deliberado — no es una alarma, es una acción; en rojo competiría con el
       precio y se leería "problema" donde hay una venta que se cierra igual. */
    --e-hay:#137a43;      --e-hay-bg:#eafaf1;
    --e-piso:#c2600f;     --e-piso-bg:#fff5ee;
    --e-50:#b01c22;       --e-50-bg:#fdeaea;
    --e-traer:#2b5c9c;    --e-traer-bg:#eef3fb;
    --e-no:#8a827f;       --e-no-bg:#f4f2f1;
  }
  body { font-family:'Montserrat',sans-serif; background:var(--bg); color:#1a1a1a; padding-bottom:40px; }

  /* ---------- Header ---------- */
  header {
    background:#fff; border-bottom:3px solid var(--rojo);
    padding:14px 16px; display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:30;
  }
  header .back { text-decoration:none; color:var(--rojo); font-size:30px; font-weight:700;
    line-height:1; padding:0 6px 4px 0; display:flex; align-items:center; }
  header img { height:34px; width:auto; }
  .h-txt h1 { font-size:15px; font-weight:800; letter-spacing:-.2px; }
  .h-txt p { font-size:11px; color:var(--gris); margin-top:1px; }
  .updated { margin-left:auto; font-size:10px; color:#aaa; text-align:right; line-height:1.3; }
  .updated b { color:var(--verde); display:block; font-size:11px; }
  #liveWarning { display:none; align-items:flex-start; gap:10px; background:#fff5ee;
    border-left:4px solid var(--naranja); margin:0 16px 8px; border-radius:10px;
    padding:12px 14px; font-size:12px; line-height:1.5; }
  #liveWarning.visible { display:flex; }
  #liveWarning .lw-icon { font-size:20px; flex-shrink:0; margin-top:1px; }
  /* Solo el título va en bloque: los <b> dentro del mensaje deben quedar en línea */
  #liveWarningTitulo { font-size:13px; font-weight:800; color:var(--rojo); display:block; margin-bottom:2px; }
  #liveWarning p { color:#7a4a00; font-weight:600; margin:0; }
  #liveWarning.err { background:#fdeaea; border-color:var(--rojo); }
  #liveWarning.err p { color:var(--rojo); }

  /* ---------- Buscador ---------- */
  .search-wrap { position:sticky; top:64px; z-index:25; background:var(--bg); padding:12px 16px 6px; }
  .search { display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--linea);
    border-radius:12px; padding:11px 14px; }
  .search:focus-within { border-color:var(--rojo); }
  .search input { border:none; outline:none; flex:1; font-family:inherit; font-size:15px; background:transparent; }
  .search svg { flex-shrink:0; }

  /* ---------- Filtros (chips) ---------- */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 16px 4px; -ms-overflow-style:none; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink:0; border:1.5px solid var(--linea); background:#fff; color:#555;
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:20px;
    cursor:pointer; white-space:nowrap; transition:.12s;
  }
  .chip .n { font-size:11px; opacity:.6; margin-left:3px; }
  .chip.active { background:var(--rojo); color:#fff; border-color:var(--rojo); }

  /* ---------- Contenido ---------- */
  main { padding:8px 16px 0; max-width:560px; margin:0 auto; }
  .grupo-titulo { font-size:11px; font-weight:700; color:#999; text-transform:uppercase;
    letter-spacing:1px; margin:18px 4px 8px; }

  .card { background:#fff; border:1px solid var(--linea); border-left-width:4px;
    border-radius:12px; padding:13px 15px; margin-bottom:10px; }
  .card.alta { box-shadow:0 2px 10px rgba(209,32,38,.07); }
  .card.t-promo  { border-left-color:var(--naranja); }
  .card.t-bundle { border-left-color:var(--verde); }
  .card.t-eol   { border-left-color:var(--rojo); }
  .card.t-nov   { border-left-color:var(--azul); }
  .card.t-aviso { border-left-color:var(--verde); }
  .card.t-trans { border-left-color:#7c3aed; }

  .card .top { display:flex; align-items:flex-start; gap:8px; }
  .card h3 { font-size:14.5px; font-weight:700; line-height:1.3; flex:1; }
  /* Título de las tarjetas de promo y precio regular: va solo, sin la fila
     .top, porque el peso visual ahora lo carga el precio de abajo. */
  .card h3.t-titulo { flex:none; margin:0 0 7px; font-size:13.5px; }
  .badge.b-promo { background:#fdecec; color:var(--rojo); }
  .tag { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    padding:3px 7px; border-radius:6px; flex-shrink:0; }
  .tag.promo  { background:#fff5ee; color:var(--naranja); }
  .tag.bundle { background:#edfaf3; color:var(--verde); }
  .tag.eol   { background:#fdeaea; color:var(--rojo); }
  .tag.nov   { background:#eef3fb; color:var(--azul); }
  .tag.aviso { background:#eafaf1; color:var(--verde); }
  .tag.trans { background:#f3effe; color:#7c3aed; }
  .card p.det { font-size:12.5px; color:#555; line-height:1.45; margin-top:6px; }
  .card p.warn { font-size:11px; color:var(--rojo); line-height:1.4; margin-top:8px;
    background:#fdeaea; padding:6px 9px; border-radius:7px; font-weight:600; }

  .meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:9px; }
  .precio { font-size:16px; font-weight:800; color:var(--rojo); }
  .precio .antes { font-size:12px; color:#bbb; text-decoration:line-through; font-weight:600; margin-right:6px; }
  .badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:#f2f2f2; color:#666; }
  .badge.urge { background:#fdeaea; color:var(--rojo); }
  /* Tramo intermedio de vigencia: queda esta quincena, no esta semana. */
  .badge.pronto { background:var(--e-piso-bg); color:var(--e-piso); }
  .badge.ok { background:#eafaf1; color:var(--verde); }
  /* Existencias dentro de la tarjeta de promo: verde hay, ámbar quedan pocas,
     rojo no hay. Va primero en la fila de badges para que se vea antes que el
     precio — de nada sirve la promo si no queda pieza. */
  .badge.stock-b.hay  { background:#eafaf1; color:var(--verde); }
  .badge.stock-b.poco { background:#fff5ee; color:var(--naranja); }
  .badge.stock-b.sin  { background:#fdeaea; color:var(--rojo); }
  /* Agotado en tienda pero vendible: se pide a otra sucursal. Morado para que
     no se confunda con "no hay" ni con "quedan pocas". */
  .badge.stock-b.traer{ background:#f3effe; color:#6d3fd4; }

  /* ---------- Inventario ---------- */
  .inv-row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--linea);
    border-radius:10px; padding:11px 14px; margin-bottom:8px; }
  .inv-info { flex:1; min-width:0; }
  .inv-info h4 { font-size:13.5px; font-weight:700; }
  .inv-info span { font-size:11px; color:#aaa; }
  .stock { text-align:center; flex-shrink:0; }
  .stock .num { font-size:20px; font-weight:800; line-height:1; }
  .stock .lbl { font-size:9px; color:#aaa; text-transform:uppercase; letter-spacing:.5px; }
  .stock .lbl.lbl2 { font-size:8px; }
  .stock.ok .num { color:var(--verde); }
  .stock.bajo .num { color:var(--naranja); }
  .stock.cero .num { color:var(--rojo); }
  .exh { font-size:10px; font-weight:700; color:var(--azul); background:#eef3fb;
    padding:4px 8px; border-radius:7px; flex-shrink:0; white-space:nowrap; }
  .exh.eol-ready { background:#eafaf1; color:var(--verde); }
  .exh.eol-pend { background:#fff5ee; color:var(--naranja); }
  .exh.trans-b { background:#f3effe; color:#7c3aed; }
  /* Precio de promoción dentro de la fila de inventario: el asesor ve las
     piezas y a cuánto se vende sin cambiar de pestaña. */
  .exh.promo-b { background:#fdecec; color:var(--rojo); }
  .card.t-eol.listo { border-left-color:var(--verde); background:#f7fdfa; box-shadow:0 2px 10px rgba(26,140,78,.10); }
  .eol-status { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:3px 7px; border-radius:6px; flex-shrink:0; }
  .eol-status.pend { background:#fff5ee; color:var(--naranja); }
  .eol-status.agot { background:#f2f2f2; color:#888; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.ok{background:var(--verde);} .dot.bajo{background:var(--naranja);} .dot.cero{background:var(--rojo);}
  /* ---- Selector seguro + MSI ---- */
  .seg-sel { margin-top:8px; }
  .seg-chips { display:flex; gap:6px; flex-wrap:wrap; margin:9px 0 0; }
  /* Datos de referencia (SKU, exhibición, meses): presentes pero en voz baja,
     para que el precio y las piezas se lean primero. */
  .t-ref { font-size:10.5px; color:#a8a2a2; line-height:1.5; margin-top:7px; }
  .t-ref b { color:#8a8484; font-weight:700; }
  .seg-chip { border:1.5px solid var(--linea); background:#fff; color:#555;
    font-family:inherit; font-size:12px; font-weight:700; padding:6px 13px;
    border-radius:20px; cursor:pointer; transition:.12s; }
  .seg-chip.active { background:var(--azul); color:#fff; border-color:var(--azul); }
  .seg-desglose { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px; margin-bottom:0; }
  .seg-precio-total { font-size:25px; font-weight:800; color:var(--rojo); line-height:1.15;
    font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  /* Precio regular tachado, junto al de promo: el ahorro se ve sin buscarlo. */
  .precio-reg { font-size:13px; font-weight:700; color:#bfb9b9; text-decoration:line-through;
    font-variant-numeric:tabular-nums; }
  .precio-linea { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .seg-prod { font-size:16px; font-weight:700; color:#999; }
  .seg-op { font-size:13px; color:#aaa; font-weight:600; white-space:nowrap; }
  .seg-msi { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  /* Los MSI son argumento de venta, no letra pequeña: el cliente pregunta
     "¿en cuánto me sale al mes?" antes que el precio de contado. Suben de 11 px
     al paso `md` de la escala y ganan aire. (8-ago-2026) */
  .msi-badge { display:inline-block; font-size:var(--t-md); font-weight:700;
    padding:6px 11px; border-radius:var(--r-sm); line-height:1.35; }
  /* La cuota mensual, que es el dato que se dice en voz alta, un punto más. */
  .msi-badge b { font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; }
  .msi-6  { background:#eafaf1; color:var(--verde); }
  .msi-12 { background:#eef3fb; color:var(--azul); }
  .msi-18 { background:#fff5ee; color:var(--naranja); }

  .empty { text-align:center; color:#bbb; font-size:13px; padding:40px 20px; }
  footer { text-align:center; font-size:10px; color:#ccc; margin-top:24px; padding:0 16px; }
  .promo-toolbar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px 4px; }
  .promo-toolbar span { font-size:12px; color:#aaa; font-weight:600; }
  .promo-toolbar button { font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700;
    background:var(--rojo); color:#fff; border:none; border-radius:8px; padding:6px 13px; cursor:pointer; }
  .promo-toolbar button:disabled { background:#ccc; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .promo-toolbar button.girando { animation:spin .7s linear infinite; }
  .btn-apartar { width:100%; margin-top:10px; border:none; border-radius:var(--r-sm);
    padding:9px; font-family:inherit; font-size:var(--t-sm); font-weight:800;
    background:var(--e-traer-bg); color:var(--e-traer); cursor:pointer; }

  /* ---- Tarjeta de producto (8-ago-2026) ----
     Blanca a propósito: el color vive en la pastilla de estado y en el precio.
     Con 79 tarjetas seguidas, teñir cada una convierte la lista en un mosaico y
     entonces el color deja de significar algo. */
  .card.prod { border-left-width:1px; border-radius:var(--r-md); padding:14px 15px;
    box-shadow:var(--sombra); border-color:#ece8e7; }
  .prod-top { display:flex; justify-content:space-between; align-items:flex-start; gap:11px; }
  .prod-nom { flex:1; min-width:0; }
  .prod-nom h3 { font-size:var(--t-lg); font-weight:700; line-height:1.3; letter-spacing:-.005em; }

  /* El SKU: arriba, monoespaciado y tocable para copiar */
  /* SKU y sello de promo en la misma línea, encima del nombre */
  .prod-eyebrow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px; }
  .prod-eyebrow .badge { padding:2px 7px; }
  .sku-eyebrow { font-family:var(--mono); font-size:11px; font-weight:600; color:#6b6360;
    letter-spacing:.02em; background:#f4f2f1; border:none; padding:2px 7px; border-radius:5px;
    cursor:pointer; font-feature-settings:'tnum'; }
  .sku-eyebrow:active { background:#e6e1e0; }
  .sku-eyebrow.copiado { background:var(--e-hay-bg); color:var(--e-hay); }
  .sku-eyebrow.copiado::after { content:' ✓'; font-family:'Montserrat',sans-serif; font-weight:800; }

  /* Pastilla de estado: el número grande es lo segundo que se mira tras el precio */
  .pastilla { border-radius:11px; padding:7px 11px; text-align:center; flex-shrink:0;
    min-width:66px; display:block; }
  .pastilla b { display:block; font-size:var(--t-xl); font-weight:800; line-height:1.05;
    font-variant-numeric:tabular-nums; }
  .pastilla span { display:block; font-size:8.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.05em; margin-top:1px; }
  .pastilla.p-hay   { background:var(--e-hay-bg);   color:var(--e-hay); }
  .pastilla.p-piso  { background:var(--e-piso-bg);  color:var(--e-piso); }
  .pastilla.p-50    { background:var(--e-50-bg);    color:var(--e-50); }
  .pastilla.p-traer { background:var(--e-traer-bg); color:var(--e-traer); }
  .pastilla.p-no    { background:var(--e-no-bg);    color:var(--e-no); }

  /* El porcentaje de ahorro, junto al precio que pinta segSelector */
  .ah { font-size:11px; font-weight:800; color:var(--e-hay);
    background:var(--e-hay-bg); padding:2px 7px; border-radius:5px; white-space:nowrap; }

  /* Los tres chips de seguro caben en UNA fila. Antes se envolvían a dos
     —"+ 2 años" se caía solo abajo— y la tarjeta crecía sin motivo: con 79
     seguidas, esa línea de más son dos pantallas extra de scroll. */
  .card.prod .seg-chips { flex-wrap:nowrap; gap:6px; }
  .card.prod .seg-chip { flex:1; padding:7px 4px; font-size:var(--t-sm);
    border-radius:var(--r-sm); white-space:nowrap; line-height:1.25; }
  /* El costo del seguro, dentro del chip y en su propia línea: cabe en móvil y
     deja el nombre del plazo legible. */
  .card.prod .seg-chip i { display:block; font-style:normal; font-size:10.5px;
    font-weight:800; opacity:.75; font-variant-numeric:tabular-nums; }

  /* Compartir vuelve al pie, a la derecha del estado, en vez de ocupar todo el
     ancho: es una acción secundaria y estaba pesando como la principal. */
  .card.prod .btn-wa { width:auto; margin:0; padding:6px 12px; font-size:var(--t-sm);
    border-radius:var(--r-sm); flex-shrink:0; }
  .prod-pie { display:flex; justify-content:space-between; align-items:center; gap:8px;
    margin-top:11px; padding-top:10px; border-top:1px solid #f3efee;
    font-size:var(--t-xs); color:#a09895; }

  /* Aviso único de vigencia, cuando todas las promos vencen el mismo día */
  .vig-barra { padding:0 16px 6px; }
  .vig-todas { display:inline-block; font-size:12px; font-weight:700; color:#8a827f;
    background:var(--e-no-bg); padding:5px 11px; border-radius:var(--r-sm); }
  .vig-todas.pronto { background:var(--e-piso-bg); color:var(--e-piso); }
  .vig-todas.urge { background:#fdeaea; color:var(--rojo); }

  /* ---- Cabecera de sección (sustituye a la barra de chips, 8-ago-2026) ---- */
  .sec-bar { display:flex; align-items:center; gap:6px; padding:10px 16px 4px; }
  .sec-volver { background:none; border:none; color:var(--rojo); font-size:26px; line-height:1;
    font-weight:700; cursor:pointer; padding:0 8px 3px 0; }
  .sec-tit { font-size:15px; font-weight:800; }

  /* ---- Tarjetas de Inicio ---- */
  .ir-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .ir-card { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px 15px;
    font-family:inherit; cursor:pointer; }
  .ir-card:active { transform:scale(.995); }
  .ir-ico { width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
    font-size:18px; flex-shrink:0; }
  .ir-txt { flex:1; min-width:0; }
  .ir-txt b { display:block; font-size:14px; font-weight:800; }
  .ir-txt span { font-size:11.5px; color:#999; font-weight:600; }
  .ir-n { font-size:20px; font-weight:800; flex-shrink:0; font-variant-numeric:tabular-nums; }

  /* ---- Franja de avisos en Inicio ---- */
  .aviso-franja { background:#fff5ee; border:1.5px solid #f7c9a6; border-radius:12px;
    padding:12px 14px; margin-bottom:12px; }
  .aviso-franja h4 { font-size:12.5px; font-weight:800; color:var(--naranja);
    text-transform:uppercase; letter-spacing:.4px; margin-bottom:7px; }
  .aviso-franja .af-item { font-size:13px; font-weight:700; line-height:1.4; }
  .aviso-franja .af-item + .af-item { margin-top:7px; padding-top:7px; border-top:1px dashed #f7c9a6; }
  .aviso-franja .af-det { display:block; font-size:11.5px; color:#8a6a45; font-weight:600; margin-top:2px; }

  /* ---- Buscador global ---- */
  .g-head { padding:10px 16px 2px; font-size:12px; color:#999; font-weight:600; }
  .g-head b { color:var(--tinta,#1a1a1a); }
  .g-vacio { text-align:center; color:#bbb; font-size:13px; padding:26px 20px; }

  /* ---- Dashboard ---- */
  .att-card { padding:16px 18px 14px; }
  .att-header { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; font-size:13px; font-weight:700; color:#555; }

  /* ── Filas del equipo ──
     `.lead-card`, `.lead-head` y `.lead-fuente` se fueron con la tarjeta aparte

<script src="datos.js"></script>
<script>
const D = window.DATOS || {};
const _cfg = (function(){ try{ return JSON.parse(localStorage.getItem('hes_store')||'null'); }catch(e){ return null; } })();

/* Sesión de antes del candado (1-ago-2026): no trae gas_token. Hoy el Apps
   Script todavía la deja pasar porque GAS_ESTRICTO está en false, pero en cuanto
   se cierre, CADA llamada se rechaza. Se avisa desde que abre la app, no a media
   captura, y sin sacar a nadie a la fuerza: el enlace lo decide la persona. */
(function(){
  var _c = _cfg;
  if(!_c || !_c.store_id || _c.gas_token) return;
  function _pintar(){
    var b = document.createElement('div');
    b.style.cssText = 'position:sticky;top:0;z-index:99;padding:11px 14px;'
      + 'background:#fdf3dc;border-bottom:2px solid #F37021;color:#7a5200;'
      + 'font-size:13px;font-weight:700;text-align:center;line-height:1.5';
    b.innerHTML = '⚠ Tu sesión es de antes y va a dejar de funcionar. '
      + '<a href="index.html" style="color:#D12026">Vuelve a entrar</a>'
      + ' — no se pierde nada de lo que tengas capturado.';
    document.body.insertBefore(b, document.body.firstChild);
  }
  if(document.readyState === 'loading') addEventListener('DOMContentLoaded', _pintar);
  else _pintar();
})();

const CLOUD_URL = (_cfg && _cfg.gas_url) ? _cfg.gas_url : 'https://script.google.com/macros/s/AKfycbwbZFsiDqZrNitPKNLqr4r6xOFu3VKprtXJacScftIJmcQdAl_yytjxK8BymWvy8I1gjA/exec';
// Token del Apps Script. Llega desde login_asesor/login_empleado — nunca se
// escribe aquí: este archivo es público y eso anularía el candado.
// Si falta, las llamadas salen sin token y el script las rechazará en cuanto
// GAS_ESTRICTO esté en true (ver GAS_guardian.gs).
const GAS_TOKEN = (_cfg && _cfg.gas_token) || '';
const TIENDA_ID     = (_cfg && _cfg.store_id) || '1217';
const TIENDA_NOMBRE = (_cfg && _cfg.nombre)   || 'Angelópolis';
const ROLE          = localStorage.getItem('hes_role') || 'asesor';
/* Quién entró. Desde que se retiró el PIN de tienda, cada quien accede con su
   número de empleado, así que esto SIEMPRE existe y el tablero no tiene que
   preguntar quién es. Antes el vendedor de un apartado se tecleaba a mano y el
   mismo asesor salía como dos personas: el nombre suelto y el completo. */
const YO = (function(){ try{ return JSON.parse(localStorage.getItem('hes_empleado')||'null'); }
                        catch(e){ return null; } })();

/* ── Quién ve Resurtir ──────────────────────────────────────────────────
   Por PUESTO, no por el permiso de Admin (decidido el 9-ago-2026). Pedirle
   mercancía al CD es trabajo de quien lleva la tienda: gerente y subgerente.
   Un asesor con el cliente enfrente necesita saber si puede vender algo o
   traerlo de otra tienda, y eso lo sigue viendo entero en Precios y en el
   buscador; la lista de pedidos no es su decisión.

   Se elige el puesto y no `admin` a propósito: son dos preguntas distintas
   —"qué haces en la tienda" y "puedes tocar la configuración"— y hoy coinciden
   por casualidad, con las mismas dos personas. El día que se separen, atarlas
   habría dado el permiso equivocado sin que nadie lo notara.

   Se compara por el PRINCIPIO de la palabra porque el mismo puesto se escribe
   de dos formas: la ficha dice "Subgerente de Tienda" y el reporte de Sonar
   "SUBGERENTE TIENDA RS". Exigir el texto exacto dejaría fuera a quien se dé
   de alta desde el otro lado. Ojo al orden de las letras: "subgerente" no
   empieza por "gerente", así que ninguno de los dos se cuela en el otro. */
const SIN_ACENTOS = new RegExp('[\\u0300-\\u036f]', 'g');
const PUESTOS_GESTION = ['gerente', 'subgerente'];
function esPuestoDeGestion_(puesto){
  // Los acentos se quitan con el rango escapado, no con los caracteres
  // combinantes escritos tal cual: invisibles en el editor, un guardado en otra
  // codificación los rompe y el filtro dejaría de quitar nada, en silencio.
  const p = String(puesto || '').toLowerCase()
              .normalize('NFD').replace(SIN_ACENTOS, '').trim();
  return PUESTOS_GESTION.some(function(x){ return p.indexOf(x) === 0; });
}

/* Sin puesto se cae en el rol, y eso NO es un agujero: es el gerente dueño de
   la tienda, que entra con el correo de la tienda y por eso no tiene ficha de
   empleado de la que sacar un puesto. Un asesor nunca llega aquí con rol de
   gerente, así que el respaldo no le abre nada.

   Es `let` porque el servidor puede desmentirlo: ver confirmarPuesto(). */
let PUEDE_GESTIONAR = (YO && YO.puesto)
  ? esPuestoDeGestion_(YO.puesto)
  : ROLE === 'gerente';

/* Un solo portero para "¿esta sección existe para quien está mirando?". Lo
   preguntan las tarjetas de Inicio, el render, el buscador y la URL: si cada
   uno lo decidiera por su cuenta, bastaría olvidar uno para que la sección
   siguiera alcanzable por ahí. */
function seccionVisible_(id){
  return id !== 'resurtir' || PUEDE_GESTIONAR;
}

document.getElementById('updated').innerHTML = '<span style="color:var(--naranja);font-weight:700">Sin confirmar</span>';
document.getElementById('liveWarning').classList.add('visible');
(function(){
  const el=document.getElementById('headerStoreSub'); if(el) el.textContent='HES '+TIENDA_ID+' · '+TIENDA_NOMBRE;
  const ft=document.getElementById('tbFooter');
  if(ft) ft.textContent='Odemás · Grupo Gigante — uso interno HES '+TIENDA_ID;

  /* La versión, en el pie. Se le PREGUNTA al service worker en vez de escribirla
     aquí: sw.js dice que es el único sitio donde vive el número, y repetirlo
     crearía dos que se separan —que es exactamente el problema que se quiso
     evitar—. Si el SW no contesta (primera carga, o navegador sin soporte) el
     pie se queda como está: es un dato de diagnóstico, no puede estorbar.

     Hace falta porque sin ella un "no me aparece el botón" es una adivinanza:
     no hay forma de saber si el código está mal o si ese teléfono se quedó con
     una copia vieja. Pasó el 7-ago-2026 con los botones de asignar serie. */
  if(!ft || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.addEventListener('message', function(ev){
    if(ev.data && ev.data.version) ft.textContent += ' · ' + ev.data.version;
  });
  navigator.serviceWorker.ready.then(function(reg){
    const sw = navigator.serviceWorker.controller || reg.active;
    if(sw) sw.postMessage('version');
  }).catch(function(){
    /* Callar es correcto aquí: `ready` no resuelve nunca si la página se abrió
       sin service worker (file://, modo incógnito, o la primera visita antes de
       registrarlo). El pie se queda sin el número y no pasa nada más — avisar
       de esto sería alarmar por no poder mostrar un dato de diagnóstico. */
  });
})();

/* ---- El día, en vivo ----
   La app queda abierta como PWA días enteros en el celular del asesor, así que
   la fecha NO se puede fijar al cargar: tocarDia() la vuelve a leer y avisa
   cuando ya cambió el día.
   Siempre fecha LOCAL: toISOString() devuelve UTC y en México (UTC-6) a partir
   de las 6 pm ya es "mañana" — las promos que vencían ese mismo día se caían
   del tablero justo en la hora pico. */
let HOY = new Date();
function hoyISO(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
let HOY_ISO = hoyISO(HOY);
/* Vigencia por fechas d1/d2 (ambas inclusive). EXIGE fecha de fin.
   Hasta el 1-ago-2026 la regla era "sin fecha = siempre vigente", y así 132 de
   las 141 promos de la hoja —cargadas sin vigencia— se mostraban para siempre:
   el equipo seguía viendo promociones terminadas en julio. Los 20 combos
   activos sí traen fecha, así que no les afecta.
   Si algo debe verse sin caducar, se le pone una fecha lejana; no se deja vacía. */
const vigenteHoy = x => !!x.d2 && (!x.d1 || HOY_ISO >= x.d1) && HOY_ISO <= x.d2;
// Relee el reloj. true = ya es otro día (hay que re-filtrar vigencias).
function tocarDia(){
  HOY = new Date();
  const iso = hoyISO(HOY);
  if(iso === HOY_ISO) return false;
  HOY_ISO = iso;
  return true;
}

const FILTROS = [

/* La pestaña se puede fijar desde fuera con #preventa. Lo usa Captura de Series
   para devolver al asesor justo donde estaba después de escanear una serie: sin
   esto vuelve al Inicio y tiene que buscar otra vez al cliente en la lista. */
/* `inicio` ya no es una sección más de FILTROS: es la pantalla de partida y el
   único camino entre secciones (8-ago-2026). Se puede fijar desde fuera con
   #preventa — lo usa Captura de Series para devolver al asesor donde estaba. */
/* La sección Y la búsqueda viven en la URL desde v152: `#promo` o
   `#promo/mate 11`. Antes el hash solo se LEÍA —para que Captura de Series
   pudiera devolver al asesor a su sección— pero nunca se escribía, así que al
   recargar siempre se caía en Inicio.

   Ahora que se escribe, volver de WhatsApp devuelve la pantalla completa: la
   sección donde estabas y lo que habías tecleado. Ver continuidad.js. */
function _deLaUrl(){
  const h = decodeURIComponent((location.hash||'').replace(/^#/,''));
  const corte = h.indexOf('/');
  const id = corte >= 0 ? h.slice(0, corte) : h;
  // La sección tiene que existir Y ser de quien está mirando: el hash se
  // teclea, se comparte por WhatsApp y lo restaura continuidad.js, así que sin
  // esto un `#resurtir` pegado a mano abriría la sección igual.
  return { id: (FILTROS.some(f=>f.id===id) && seccionVisible_(id)) ? id : 'inicio',
           q:  corte >= 0 ? h.slice(corte+1) : '' };
}
let filtroActivo = _deLaUrl().id;
let busqueda = _deLaUrl().q;

/* Escribe el estado en la URL sin ensuciar el historial: con pushState, cada
   letra tecleada en el buscador dejaría una entrada y el botón «atrás» del
   teléfono tardaría veinte toques en salir de la app. */
function _urlAlDia(){
  const h = filtroActivo + (busqueda ? '/' + busqueda : '');
  const nueva = '#' + encodeURIComponent(h).replace(/%2F/g,'/');
  if(location.hash !== nueva){
    try{ history.replaceState(null, '', nueva); }
    catch(e){ location.hash = nueva; }   // navegador sin History API: se nota el salto, pero funciona
  }
}

let APARTADOS = [];
/* El total decía "de 36" escrito a mano. Al habilitar una pieza más en Orange
   Ocean (5-ago-2026) el banner habría dicho "quedan 1 de 36" con 37 repartidas:
   se suma de los cupos para que no vuelva a mentir. */

function diasRestantes(fecha){
  const f = new Date(fecha+'T00:00:00');
  // Contra la MEDIANOCHE de hoy, no contra la hora actual: comparando con el
  // instante, una promo que vence hoy salía "Vencida" a partir del mediodía
  // (Math.round de -0.5 días).
  const base = new Date(HOY.getFullYear(), HOY.getMonth(), HOY.getDate());
  return Math.round((f - base)/86400000);
}
const _MESES_CORTO = ['ene','feb','mar','abr','may','jun',
                     'jul','ago','sep','oct','nov','dic'];
const _MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio',
                      'agosto','septiembre','octubre','noviembre','diciembre'];

/* La vigencia se dice con FECHA y solo cuando queda poco (8-ago-2026).

   Antes salía en todas las promos como "⏳ 23 días" y solo se ponía en rojo con
   2 días o menos. O sea que entre 23 días y 3 días se veía exactamente igual,
   cuando la decisión de qué empujar es la contraria. Y con 77 promos, 77 badges
   que casi nunca dicen nada accionable acaban sin mirarse.

   Ahora: por encima de 15 días no aparece —si está, es que corre prisa— y dice
   la fecha, que es lo que se le repite al cliente ("la promo va hasta el 31"),
   no una cuenta mental de días. El color separa "esta quincena" de "esta
   semana". Sin reloj de arena: con el color diciendo la urgencia, el emoji solo
   robaba ancho a un badge estrecho. */
const VIGENCIA_AVISAR_DESDE = 15;   // días

/* Cuando TODAS las promos vigentes vencen el mismo día, el badge por tarjeta no
   distingue nada: repetiría la misma fecha 117 veces para decir algo que es
   igual en toda la pantalla. En ese caso se calla aquí y el aviso sale una sola
   vez arriba, en la barra.

   Pero no siempre es así —el CEA de agosto trae todo al 31 y otros meses mezcla
   fechas—, así que no se puede decidir de antemano: se mira en cada render.
   Lo pone `vigenciaComun()` justo antes de pintar la sección. */
let _vigUnica = null;

/* Devuelve la fecha si TODAS las promos con existencia vencen el mismo día;
   null si hay mezcla. Solo mira las que se están mostrando: si el buscador
   filtró a tres y las tres coinciden, el aviso único también vale. */
function vigenciaComun(promos){
  const fechas = new Set(promos.map(p => p.d2).filter(Boolean));
  if(fechas.size !== 1) return null;
  // Si alguna no tiene fecha, no se puede afirmar que todas venzan igual.
  if(promos.some(p => !p.d2)) return null;
  return [...fechas][0];
}

function avisoVigencia(fecha){
  const d = diasRestantes(fecha);
  const f = new Date(fecha+'T00:00:00');
  const cuando = f.getDate() + ' de ' + _MESES_LARGO[f.getMonth()];
  const cls = d <= 5 ? 'urge' : d <= VIGENCIA_AVISAR_DESDE ? 'pronto' : '';
  const cola = d < 0 ? 'vencidas' : d === 0 ? 'hoy es el último día'
             : d === 1 ? 'mañana es el último día' : `quedan ${d} días`;
  return `<span class="vig-todas ${cls}">Promos hasta el ${cuando} · ${cola}</span>`;
}

function badgeVigencia(fecha){
  const d = diasRestantes(fecha);
  if(_vigUnica) return '';                        // ya lo dice la barra de arriba
  if(d > VIGENCIA_AVISAR_DESDE) return '';        // aún queda mucho: no estorba
  const f = new Date(fecha+'T00:00:00');
  const cuando = f.getDate() + ' ' + _MESES_CORTO[f.getMonth()];
  const txt = d < 0  ? 'Vencida'
            : d === 0 ? 'Último día'
            : d === 1 ? 'Hasta mañana'
            : `Hasta el ${cuando}`;
  // ≤5 días es "esta semana": rojo. El resto del tramo, ámbar.
  const cls = d <= 5 ? 'urge' : 'pronto';
  return `<span class="badge ${cls}">${txt}</span>`;
}
function coincide(...campos){
  if(!busqueda) return true;
  return campos.join(' ').toLowerCase().includes(busqueda);
}

function selSeg(id, idx, p0, p1, p2, i1, i2) {
  const wrap = document.getElementById(id);
  if (!wrap) return;
  wrap.querySelectorAll('.seg-chip').forEach((c,i) => c.classList.toggle('active', i===idx));
  const total = idx===0 ? p0 : idx===1 ? p1 : p2;
  const segCosto = idx===1 ? i1 : idx===2 ? i2 : 0;
  wrap.querySelector('.seg-desglose').innerHTML = desgloseHtml(p0, total, segCosto);
  wrap.querySelector('.seg-msi').innerHTML = msiInfo(total);

  /* El precio regular tachado y el % de ahorro SOLO valen sin seguro
     (8-ago-2026). Con "+1 año" el precio de arriba ya es producto + seguro, y
     dejar tachado el regular del producto insinúa un ahorro que no existe:
     $2.690 + seguro comparado con $2.790 no es una rebaja, son dos cosas
     distintas.

     Se ocultan en vez de borrarse porque hay que poder volver a "Sin seguro" y
     recuperarlos. Y viven fuera de `.seg-desglose` porque esa línea se reescribe
     entera en cada toque: dentro, se perderían al primero. */
  const conSeguro = idx !== 0;
  wrap.querySelectorAll('.precio-reg, .ah').forEach(el => {
    el.style.display = conSeguro ? 'none' : '';
  });
}
/* slidePromo y onPromoSliderScroll se retiraron el 7-ago-2026 junto con las dos
   pestañas deslizables de promos: ahora es una sola lista con encabezados.
   Se borran en vez de dejarlas "por si acaso" — código que nadie llama es
   código que nadie mantiene, y el CSS del slider se fue con ellas. */
/* ---- Assurant attach rate ----
   El attach se DERIVA de las ventas capturadas en Captura de Series, que ya
   guarda cada venta como {vend, fecha, seguro:true/false}. Antes esta tarjeta
   y el leaderboard leían 'attv_<vendedor>_<fecha>', una clave que ninguna app
   escribía nunca: el equipo aparecía siempre en "—" y el resumen de WhatsApp
   salía sin renglones por vendedor.
   Los botones ✓/✗ siguen existiendo, pero solo como AJUSTE MANUAL para ventas
   que no pasaron por la app (por eso se suman aparte y se pueden reiniciar). */
const SERIES_KEY = 'hes1217_series_v1';   // misma clave que escribe captura_series.html
let VENTAS_NUBE = null;        // {vendedor:{c,s}} de TODA la tienda; null = no disponible
let VENTAS_NUBE_HORA = '';

/* Los botones ✓/✗ de ajuste manual se retiraron el 8-ago-2026 (v151).
   No fue por espacio. Sumaban un conteo guardado en el localStorage de UN
   celular al total que viene de Supabase, que es de TODA la tienda. Con eso:

     · el Assurant del día salía distinto en cada teléfono, y ninguno era el
       bueno — el mismo KPI que se le reporta a Demetrio
     · una venta ajustada a mano y capturada después contaba DOS veces en ese
       aparato
     · el % grande no cuadraba con las filas del equipo: las filas venían de la
       nube, el porcentaje llevaba los manuales encima

   Ahora el número es exactamente lo que dice Supabase, igual en todos lados.
   Si una venta falta, se captura en la app —que es donde vive la serie— en vez
   de parchear el número en una pantalla. Y desde v150 los apartados entran
   solos el día que se cobran, que era el hueco de verdad. */

// Ventas capturadas HOY en este dispositivo
function ventasHoyLocal(){
  try{
    const items = JSON.parse(localStorage.getItem(SERIES_KEY)||'[]');
    const hoy = new Date().toLocaleDateString('es-MX');
    return items.filter(i=>i.fecha===hoy);
  }catch(e){ return []; }
}
// {vendedor:{c,s}} — de la nube si el GAS ya expone modo=ventas_hoy (toda la
// tienda); si no, de las capturas de este equipo.
function attPorVendedor(){
  if(VENTAS_NUBE) return VENTAS_NUBE;
  const acc = {};
  ventasHoyLocal().forEach(v=>{
    const n = v.vend || '(sin nombre)';
    if(!acc[n]) acc[n] = {c:0,s:0};
    if(v.seguro===true) acc[n].c++; else acc[n].s++;
  });
  return acc;
}
function attCapturado(){
  const por = attPorVendedor(); const t = {c:0,s:0};
  Object.keys(por).forEach(n=>{ t.c += por[n].c||0; t.s += por[n].s||0; });
  return t;
}
// El total es lo capturado y nada más. Se conserva la función porque la llaman
// el resumen de WhatsApp y la tarjeta; que sea un alias hoy no la hace inútil.
function attTotal(){ return attCapturado(); }

/* ---- Leaderboard & Resumen WA ---- */
// Los nombres vienen de la config de tienda (Supabase). Sin sesión la lista va
// vacía a propósito: este archivo es público y no debe traer nombres del equipo.
const VENDEDORES_TB = (_cfg && Array.isArray(_cfg.vendedores) && _cfg.vendedores.length)
  ? _cfg.vendedores
  : [];
function nombreCorto(n){ const p=n.split(' '); return p[0]+(p[1]?' '+p[1][0]+'.':''); }
// Vendedores configurados + cualquiera que haya vendido hoy, ordenados por attach
function filasLeaderboard(){
  const por = attPorVendedor();
  const nombres = Array.from(new Set(VENDEDORES_TB.concat(Object.keys(por))));
  return nombres.map(v=>{
    const a = por[v] || {c:0,s:0};
    const t = a.c + a.s;
    return { vend:v, c:a.c, s:a.s, total:t, pct: t>0 ? Math.round(a.c/t*100) : null };
  }).sort((a,b)=>{
    if(a.pct===null && b.pct===null) return a.vend.localeCompare(b.vend);
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return b.pct - a.pct || b.total - a.total;
  });
}
/* El equipo va PLEGADO dentro de la tarjeta del Assurant (v151). Eran dos
   tarjetas apiladas que se comían pantalla y media antes de llegar a Precios, y
   la mitad de sus renglones eran guiones de gente que aún no vendía.

   Se recuerda abierto o cerrado entre recargas: quien lo abre suele quererlo
   abierto todo el día, y el tablero se repinta solo cada pocos minutos. */

})();
function toggleEquipo(){

  render();
}
function equipoHtml(){
  const filas = filasLeaderboard();
  const conVenta = filas.filter(f => f.total > 0).length;
  const rows = filas.map(f=>{
    const ev = f.pct===null?'':f.pct>=25?'✅':f.pct>=15?'⚠️':'🔴';
    const col= f.pct===null?'#aaa':f.pct>=25?'var(--verde)':f.pct>=15?'var(--naranja)':'var(--rojo)';
    return `<div class="lead-row">

      <span class="lead-att" style="color:${col}">${f.pct!==null?f.pct+'% '+ev:'—'}</span>
    </div>`;
  }).join('');
  // Sin nadie en la lista no hay nada que plegar, y un desplegable vacío deja

      <span class="flecha">▾</span> 👥 Equipo hoy
      <span class="cuantos">${conVenta} de ${filas.length} con venta</span>
    </button>

}
function resumenWA(){

/* ¿Se le puede vender HOY a un cliente que está enfrente?
   No es lo mismo que "existe una pieza". La de exhibición de un producto ACTIVO
   no se vende: se queda en el aparador hasta que llegue caja del CD. Solo se
   vende la de piso cuando el producto está EOL, y entonces va al 50 %.

   Corregido el 8-ago-2026. Antes esto devolvía true con solo tener exhibición, y
   por eso 17 SKU sin una sola pieza vendible se contaban como "con existencia",
   salían arriba en Precios y no ofrecían apartar. El asesor leía "1 de piso",
   creía que tenía qué entregar, y el cliente se iba con las manos vacías. */
function tieneExistencia_(sku){
  const k = estadoSku(sku).k;
  return k === 'hay' || k === '50';
}

// Calcula el stock cerrado y la exhibición restante desde los datos crudos de
// la nube. Corre dentro de calcDerivados (no al cargar) para que respete el
// estado EOL aunque los datos de EOL lleguen después del inventario.
function finalizarStock(item){
  if(!item || item._onhand === undefined) return;   // sin datos de nube: conserva lo estático
  const o = item._onhand||0, e = item._exhibeRaw||0, v = item._vendido||0, ev = item._ev||0;
  item.stock = Math.max(0, o - v);                   // stock cerrado (almacén), sin exhibición
  /* La exhibición solo la venden los productos EOL. `ev` (exh_vendida) usa su
     propio corte, que NO se reinicia con el ON HAND diario, para que una pieza
     vendida no reaparezca al día siguiente.

     SE RESTA TAL CUAL desde el 17-ago-2026 (v175). Antes aquí había un
     `Math.max(0, ev - o)`: el cliente calculaba por su cuenta cuántas ventas
     habían excedido el almacén, porque el servidor solo mandaba el total. Desde
     v174 `exh_vendida` YA trae esa cuenta hecha —más las ventas marcadas como
     pieza de exhibición—, así que restarlo otra vez lo anulaba:

         e=1, ev=1, onhand=5  ->  1 - max(0, 1-5) = 1   ✗ decía "1 en exhibición"
                                  1 - 1           = 0   ✓

     Visto en piso el mismo día: el aparador seguía marcando una pieza que ya se
     había vendido. Cambiar lo que significa un campo del servidor obliga a
     mirar quién lo consume — el campo llegaba bien, la cuenta era la vieja. */
  item.exhibe = eolSkuSet.has(item.sku) ? Math.max(0, e - ev) : e;
}
function calcDerivados(){
  (D.inventario||[]).forEach(finalizarStock);
  Object.keys(invBySku).forEach(function(sku){ finalizarStock(invBySku[sku]); });
  EOL = (D.eol||[]).map(e=>{
    const inv = invBySku[e.sku] || {};
    const stock = inv.stock||0, exhibe = inv.exhibe||0;
    const estado = (stock===0 && exhibe>0) ? 'listo' : (stock>0 ? 'pendiente' : 'agotado');
    const precio = e.precio || inv.precio || 0;
    return { sku:e.sku, producto:e.producto||inv.producto||('SKU '+e.sku),
      precio:precio, precio50:precio?precio/2:null, stock, exhibe, estado };
  }).filter(e=>e.exhibe>0 && !EOL_PAUSADOS.has(e.sku));
  eolMap = {}; EOL.forEach(e=>{ eolMap[e.sku]=e.estado; });
  RESURTIR = (D.inventario||[]).filter(x=>x.stock===0 && x.exhibe>0 && !eolSkuSet.has(x.sku))
              .sort((a,b)=> a.producto.localeCompare(b.producto));
  AGOTADOS = (D.inventario||[]).filter(x=>(x.stock||0)===0 && (x.exhibe||0)===0 && !eolSkuSet.has(x.sku))
              .sort((a,b)=> a.producto.localeCompare(b.producto));

  /* Y los que están en promoción pero NUNCA han tenido fila de inventario.
     Detectado el 8-ago-2026 con el MatePad P-Max 13.2": sale en el folleto, en
     Precios aparece con su botón de apartar... y en la lista de resurtir no
     estaba, porque las dos listas de arriba se arman desde `D.inventario` y ese
     SKU no tiene fila ahí. Nadie lo iba a pedir nunca.

     Es el caso más urgente de los tres, no el más raro: producto en promoción
     vigente del que la tienda no tiene ni la de exhibición. */
  const _conFila = new Set((D.inventario||[]).map(x=>x.sku));
  PROMOS.forEach(p=>{
    if(!p.sku || _conFila.has(p.sku) || eolSkuSet.has(p.sku)) return;
    _conFila.add(p.sku);   // una promo repetida no lo pide dos veces
    AGOTADOS.push({ sku:p.sku, producto:p.producto||('SKU '+p.sku),
                    stock:0, exhibe:0, precio:p.pr||p.pp||0, nuncaLlego:true });
  });
  AGOTADOS.sort((a,b)=> a.producto.localeCompare(b.producto));
}
calcDerivados();

function cuenta(id){
  if(id==='inicio') return '';
  if(id==='promo') return PROMOS.filter(x=>coincide(x.producto,x.sku) && tieneExistencia_(x.sku)).length;
  // Lo que cuenta es lo que hay que ENTREGAR, no lo que se puede apartar: el
  // número de la tarjeta es trabajo pendiente, no inventario disponible.
  if(id==='apartados') return APARTADOS.filter(a=>{
    const e=String(a.estatus||'').toLowerCase(); return e!=='cancelado' && e!=='entregado'; }).length;
  if(id==='eol')   return EOL.filter(e=>coincide(e.producto,e.sku) && e.estado==='listo').length;
  if(id==='inv')   return (D.inventario||[]).filter(x=>coincide(x.producto,x.sku)&&((x.stock||0)>0||(x.exhibe||0)>0)).length;
  if(id==='resurtir') return [...AGOTADOS,...RESURTIR].filter(x=>coincide(x.producto,x.sku)).length;
  return 0;
}

// ¿la sección tiene algún dato? (ignora el buscador, para que las pestañas no salten al escribir)
function seccionTieneItems(id){
  if(id==='promo')    return PROMOS.length>0;
  if(id==='apartados') return APARTADOS.length>0;
  if(id==='eol')      return EOL.length>0;
  if(id==='inv')      return (D.inventario||[]).length>0;
  if(id==='resurtir') return RESURTIR.length>0 || AGOTADOS.length>0;
  return false;
}

/* La barra de chips se retiró el 8-ago-2026. Se navega desde Inicio y se vuelve
   con la flecha; para encontrar un producto concreto está el buscador, que desde
   hoy mira en TODO el tablero y no solo en la sección abierta.

   Los chips tenían un problema que no se veía: obligaban a saber en qué pestaña
   estaba cada cosa ANTES de buscarla. Con cinco secciones y 227 SKU, eso es
   pedirle al asesor que recuerde el mapa mientras el cliente espera. */
function irA(id){ filtroActivo = id; busqueda = ''; const q = document.getElementById('q');
  if(q) q.value = ''; window.scrollTo(0,0); _urlAlDia(); render(); }

/* ── Criterios de "qué se puede vender / traer" ──────────────────────────
   Viven aquí sueltos porque los usan TRES sitios: la sección de precios, las
   tarjetas de Inicio y el buscador global. Cuando estaban escritos dentro del
   render, cada nuevo consumidor los copiaba, y el día que cambió el criterio
   —excluir los EOL agotados, 7-ago— hubo que perseguirlo por varios sitios. */
/* ── Estado de existencia de un SKU ─────────────────────────────────────
   UNA sola función decide en qué estado está un producto, y todas las tarjetas
   la usan. Antes cada tarjeta lo deducía por su cuenta con sus propios if, y
   por eso "solo exhibición" significaba cosas distintas según dónde se mirara:
   en la lista de resurtir era "pedir caja" y en promos salía como "sin piezas".

   Son CINCO estados, no tres. El que más se confunde es el tercero: quedarse
   solo con la pieza de piso significa "no hay nada que vender" si el producto
   sigue vivo, y "rematar al 50%" si está descontinuado. Es la misma existencia
   y dos acciones opuestas.

   Y de esos cinco, SOLO DOS se pueden vender hoy: 'hay' y '50'. La exhibición
   de un producto activo no se toca — se pide caja al CD, o se le trae al
   cliente de otra tienda. Por eso 'piso' muestra 0 para vender y no el número
   de piezas del aparador: es lo que se puede entregar, no lo que se ve. */
function estadoSku(sku){
  const inv = invBySku[sku] || {};
  const st = inv.stock || 0, ex = inv.exhibe || 0;
  const esEol = eolSkuSet.has(sku);
  if(st > 0)              return { k:'hay',   n:st, txt: st===1?'pieza':'piezas', pie:ex?`${ex} en exhibición`:'' };
  if(ex > 0 && esEol)     return { k:'50',    n:'50%', txt:'última', pie:'Última pieza de piso' };
  if(ex > 0)              return { k:'piso',  n:0,  txt:'para vender', pie:`${ex} en piso, no se vende` };
  if(esEol)               return { k:'no',    n:'—', txt:'ya no',  pie:'Descontinuado' };
  return                         { k:'traer', n:0,   txt:'se trae', pie:'De otra tienda' };
}

// La pastilla que pinta ese estado. El número va grande a propósito: después
// del precio, "cuántas hay" es lo que más se mira.
/* Botón de apartar: en lo que NO se puede vender hoy pero SÍ se puede conseguir.
   Son dos casos y hasta hoy solo se cubría uno:
     · 'traer' — cero piezas por todos lados
     · 'piso'  — solo queda la de exhibición, que de un producto activo no se
                 vende. Para el cliente es exactamente lo mismo que cero.
   Queda fuera 'no' (descontinuado y agotado): apartarlo sería cobrarle a alguien
   algo que no va a llegar nunca. Por eso se apoya en `estadoSku` y no en
   "¿tiene cero piezas?". */
/* EXCEPCIONES, una por una y con su motivo escrito.
   No son una regla nueva: los descontinuados siguen SIN poder apartarse. Cada
   SKU de aquí es un caso cerrado, no un permiso general — si algún día son
   muchos, entonces la regla está mal y hay que cambiarla, no alargar la lista.

   · 100274990 · Watch GT6 1.32" AMLD MO · 8-ago-2026
     La pieza se vendió a promesa de entrega ANTES de que la línea GT6 pasara a
     EOL. La venta ya está hecha y el equipo viene de otra tienda; falta
     registrar el apartado para que aparezca en la lista de entregas y se le
     pueda ligar la serie. Sin esto no hay forma de meterlo por la app. */
const APARTAR_EXCEPCION = new Set(['100274990']);

function botonApartar(sku, producto, precio){
  const k = estadoSku(sku).k;
  if(k !== 'traer' && k !== 'piso' && !APARTAR_EXCEPCION.has(sku)) return '';
  return `<button class="btn-apartar" onclick="abrirApartado('${sku}','${encodeURIComponent(producto||'')}',${Number(precio)||0})">📋 Apartar para un cliente</button>`;
}

function pastillaEstado(sku){
  const e = estadoSku(sku);
  return `<span class="pastilla p-${e.k}"><b>${e.n}</b><span>${e.txt}</span></span>`;
}

/* El SKU va ARRIBA y en monoespaciada (8-ago-2026). Estaba al pie en 10,5 px
   gris claro —lo de menos contraste de la tarjeta— y resulta que se usa para
   pedir a otra tienda y para buscar en el POS. Monoespaciada por lo mismo que
   las series de la preventa: se teclea dígito a dígito y en tipografía normal
   el 0 y la O se confunden con prisa.
   Se toca y se copia: nueve dígitos transcritos a mano se equivocan. */
function eyebrowSku(sku){
  return `<button class="sku-eyebrow" onclick="copiarSku(event,'${sku}')"
           title="Tocar para copiar">${sku}</button>`;
}

function copiarSku(ev, sku){
  ev.stopPropagation();
  const btn = ev.currentTarget;
  const listo = () => { btn.classList.add('copiado');
    setTimeout(()=>btn.classList.remove('copiado'), 1100); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(sku).then(listo).catch(()=>copiarSkuViejo(sku, listo));
  } else copiarSkuViejo(sku, listo);
}
// Respaldo para los navegadores del piso que no tienen clipboard en http o en
// vistas embebidas. Sin esto, tocar el SKU no haría nada y no se sabría por qué.
function copiarSkuViejo(sku, listo){
  try{
    const t = document.createElement('textarea');
    t.value = sku; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove(); listo();
  }catch(e){ /* si tampoco se puede, el SKU está a la vista para teclearlo */ }
}

// Misma pregunta que `tieneExistencia_`, con el objeto en vez del SKU. Una sola
// regla para las dos: tener pieza y poder venderla no son lo mismo.
function conPiezas_(x){ return tieneExistencia_(x.sku); }
// Con piezas se muestra siempre. Sin piezas, solo si NO es EOL: ése sí se
// puede pedir a otra tienda; un EOL agotado no se trae de ningún lado.
function seConsigue_(x){ return conPiezas_(x) || !eolSkuSet.has(x.sku); }

function inventarioSinPromo(){
  const conPromo = new Set(PROMOS.map(p=>p.sku));
  return (D.inventario||[]).filter(x => !conPromo.has(x.sku) && eolMap[x.sku] !== 'listo');
}
function sinPromoConPiezasN(){ return inventarioSinPromo().filter(conPiezas_).length; }

/* ── Buscador global (8-ago-2026) ───────────────────────────────────────
   Antes el buscador filtraba SOLO dentro de la sección abierta. Un producto
   podía existir, coincidir con lo escrito y no aparecer — sin ninguna señal de
   que había que mirar en otra pestaña. Con el cliente enfrente eso se traduce
   en "no lo tenemos", que es la peor respuesta posible cuando sí lo hay.

   Ahora busca en todo y agrupa por origen, porque de dónde sale cada resultado
   es justo lo que cambia el precio que se cobra. */
function buscarEnTodo(){
  const bloques = [];
  const push = (titulo, items, fn, nota) => {
    if(!items.length) return;
    bloques.push({ titulo, n:items.length, html:items.map(fn).join(''), nota,
                   skus:items.map(i=>i.sku) });
  };

  const promosCoinc = PROMOS.filter(x=>coincide(x.producto,x.sku));
  push('🔥 Con promoción', promosCoinc.filter(x=>tieneExistencia_(x.sku)), cardPromo);

  const sinPromo = inventarioSinPromo().filter(x=>coincide(x.producto,x.sku));
  push('💰 Precio regular', sinPromo.filter(conPiezas_), cardPrecioReg);

  push('🏷️ Vender al 50%', EOL.filter(e=>coincide(e.producto,e.sku) && e.estado==='listo'), cardEol);

  /* Los apartados también se buscan: "¿lo de Mayra ya llegó?" es una pregunta
     de todos los días, y antes había que ir a la sección a mirar la lista. */
  const aps = APARTADOS.filter(a => coincide(a.cliente, a.sku, a.color, a.serie));
  push('📋 Apartados de clientes', aps, cardApartado);

  /* La lista de pedidos solo para quien pide (9-ago-2026). El producto NO
     desaparece del buscador para nadie: los agotados y los que solo conservan
     la pieza de piso siguen saliendo abajo, en «se traen de otra tienda», que
     es la respuesta que el asesor necesita con el cliente enfrente. Lo que se
     le quita es el encabezado de "hay que pedir esto", no el resultado.
     Comprobado en las pruebas: sin este bloque, ninguno se queda sin bloque. */
  /* Por el portero, no por la bandera (17-ago-2026). Hoy `seccionVisible_`
     devuelve exactamente `PUEDE_GESTIONAR`, así que no cambia nada — pero el
     día que la sección se esconda por otro motivo, este sitio se habría quedado
     con la regla vieja. Es el cuarto consultante que menciona la cadena 1-bis. */
  if(seccionVisible_('resurtir'))
    push('🔄 Hay que resurtir', [...AGOTADOS,...RESURTIR].filter(x=>coincide(x.producto,x.sku)), rowResurtir);

  // Se traen de otra tienda: agotados que NO son EOL, con y sin promo.
  const traibles = [...promosCoinc.filter(x=>!tieneExistencia_(x.sku) && !eolSkuSet.has(x.sku)).map(x=>({__promo:x})),
                    ...sinPromo.filter(x=>!conPiezas_(x) && seConsigue_(x)).map(x=>({__reg:x}))];
  if(traibles.length){
    bloques.push({ titulo:'📭 Se traen de otra tienda', n:traibles.length,
      html: traibles.map(t => t.__promo ? cardPromo(t.__promo) : cardPrecioReg(t.__reg)).join(''),
      skus: traibles.map(t => (t.__promo||t.__reg).sku) });
  }

  /* Lo que coincide pero NO salió en ningún bloque de arriba. Son sobre todo los
     descontinuados ya agotados: no se venden, no se resurten y no se traen, así
     que ninguna sección los lista — y sin este bloque, buscarlos daría "nada
     coincide" sobre un producto que el tablero sí conoce y del que sabe el
     precio. El cliente pregunta por él justamente porque ya no está.

     OJO al construir `mostrados`: tiene que llevar lo que DE VERDAD se pintó,
     no lo que se consideró. La primera versión metía aquí `sinPromo` entero
     —incluidos los agotados que el bloque de precio regular filtra— y entonces
     estos productos no salían por ningún lado y este bloque nunca aparecía.
     Un candado que se cierra sobre sí mismo. */
  const mostrados = new Set();
  bloques.forEach(b => (b.skus||[]).forEach(k => mostrados.add(k)));
  const soloCatalogo = (D.inventario||[]).filter(x =>
    coincide(x.producto,x.sku) && !mostrados.has(x.sku));
  if(soloCatalogo.length){
    bloques.push({ titulo:'📚 Ya no se maneja en la tienda', n:soloCatalogo.length,
      nota:'Descontinuados y sin piezas. Se puede consultar el precio, pero no se pueden pedir.',
      html: soloCatalogo.slice(0,25).map(cardPrecioReg).join('') });
  }

  const total = bloques.reduce((a,b)=>a+b.n, 0);
  if(!total) return `<div class="g-vacio">Nada coincide con «${esc(busqueda)}».<br>Prueba con menos letras o con el SKU.</div>`;

  return `<div class="g-head"><b>${total}</b> resultado${total!==1?'s':''} en todo el tablero</div>`
       + bloques.map(b => `<div class="grupo-titulo" style="margin-top:14px">${b.titulo} (${b.n})</div>`
           + (b.nota?`<div class="g-head" style="padding-top:0">${b.nota}</div>`:'')
           + b.html).join('');
}

// Precio de venta de un artículo DENTRO de un combo:
// EOL última pieza → 50% del regular; con promoción → precio promo; si no → regular.
function _promoDe(sku){ return PROMOS.find(p=>p.sku===sku); }
function _eolDe(sku){ return EOL.find(e=>e.sku===sku); }
function _eolRaw(sku){ return (D.eol||[]).find(e=>e.sku===sku); }
// Un EOL solo se vende al 50% cuando está "listo" (stock cerrado en 0 y con
// pieza de exhibición). Un EOL que todavía tiene stock (pendiente, ej. Pura 80)
// se vende a su precio NORMAL de promoción, NO al 50%.
function esVentaAl50(sku){
  const er=_eolRaw(sku);
  if(!er || !parseFloat(er.precio)) return false;
  const ea=(typeof EOL!=='undefined')?EOL.find(x=>x.sku===sku):null;
  if(ea) return ea.estado==='listo';
  // No está en el array calculado (exhibición 0 en datos locales): se considera
  // venta al 50% solo si ya no tiene stock cerrado NI promoción vigente.
  const inv=invBySku[sku]||{};
  return (inv.stock||0)===0 && !_promoDe(sku);
}
function precioVentaEnCombo(sku){
  const er=_eolRaw(sku);
  if(esVentaAl50(sku)) return {precio:(parseFloat(er.precio)||0)/2, nota:'−50% última pieza'};
  const p=_promoDe(sku);
  if(p){
    const v=parseFloat(String(p.pp||p.pr||0).replace(/[^0-9.]/g,''));
    if(v) return {precio:v, nota:(p.pp&&p.pr&&String(p.pp)!==String(p.pr))?'promo':''};
  }
  const inv=invBySku[sku];
  if(inv && inv.precio) return {precio:parseFloat(inv.precio)||0, nota:''};
  if(er && parseFloat(er.precio)) return {precio:parseFloat(er.precio)||0, nota:''};
  return {precio:0, nota:'sin precio'};
}
// Desglose completo del combo: cada artículo con su precio, mica, seguro y total.
function desgloseBundle(x){
  const skuArr=(x.skus||'').split(',').map(s=>s.trim()).filter(Boolean);
  const total=Number(x.precio)||0;
  let sub=0;
  const rows=skuArr.map(s=>{
    const {precio,nota}=precioVentaEnCombo(s);
    sub+=precio;
    const nombre=invBySku[s]?invBySku[s].producto:('SKU '+s);
    return `<div class="dg-row"><span>${nombre}${nota?` <em>${nota}</em>`:''}</span><b>${money2(precio)}</b></div>`;
  }).join('');
  let extras=total-sub;
  const tieneMica=/mica/i.test(x.nombre||'');
  let micaRow='';
  if(tieneMica){ micaRow=`<div class="dg-row"><span>Mica de hidrogel</span><b>${money2(149)}</b></div>`; extras-=149; }
  const segRow= extras>0.5 ? `<div class="dg-row dg-seg"><span>🛡️ Seguro incluido</span><b>${money2(extras)}</b></div>` : '';
  const rg=(x.nombre||'').match(/regalo:\s*([^)·]+)/i);
  const regaloLine= rg ? `<div class="dg-row dg-regalo"><span>🎁 Regalo: ${rg[1].trim()}</span><b>Incluido</b></div>` : '';
  return `<div class="bundle-desglose">
    ${rows}
    <div class="dg-row dg-sub"><span>Subtotal productos</span><b>${money2(sub)}</b></div>
    ${micaRow}
    ${segRow}
    ${regaloLine}
    <div class="dg-row dg-total"><span>Total combo</span><b>${money2(total)}</b></div>
  </div>`;
}
/* ===================== PREVENTA ===================== */
function cardApartado(a){
  /* El producto sale de `a.color`, que desde el 4-ago guarda el nombre entero
     ("Pura 90S Pro Max 12/512GB · Graphite Black"). Antes se sacaba de la lista
     fija de la Pura 90S, y con traspasos de cualquier SKU esa lista ya no
     existe. Si faltara, se cae al catálogo por SKU. */
  const inv = invBySku[a.sku] || {};
  const nombre = a.color || inv.producto || ('SKU '+a.sku);
  const est = String(a.estatus||'Apartado');
  const e   = est.toLowerCase();
  const cls = e==='entregado' ? ' ent' : e==='asignado' ? ' asg' : e==='cancelado' ? ' can' : '';
  const vivo = e!=='cancelado' && e!=='entregado';
  /* Las acciones solo se pintan mientras el apartado siga vivo. Un entregado se
     queda como registro de consulta: su serie ya no se toca porque el equipo
     salió de la tienda y hay una venta apuntando a ella. */
  const acciones = !vivo ? '' : `<div class="ap-acc">
      <button class="btn-ap asignar" onclick="asignarSerie('${a.id}')">${a.serie?'🔁 Cambiar serie':'📷 Asignar serie'}</button>
      <button class="btn-ap entregar" onclick="entregarApartado('${a.id}')" ${a.serie?'':'disabled'}>✅ Entregar</button>
      <button class="btn-ap gris" onclick="cancelarApartado('${a.id}')" title="Cancelar apartado">✕</button>
    </div>`;
  return `<div class="card ap-card ${a.tipo==='traspaso'?'t-tras':'t-pre'}${a.diasTarde>0?' t-tarde':''}" style="padding:11px 14px">
    <div class="ap-row" style="padding:0">
      <div style="flex:1;min-width:0">
        <h4 style="font-size:13.5px;font-weight:700">${esc(a.cliente||'(sin nombre)')} ${a.seguro==='Si'?'🛡️':''}</h4>
        <span style="font-size:11px;color:#999">${esc(nombre)} · SKU ${a.sku} · ${esc(a.telefono||'sin tel')}${a.precio?' · '+money(Number(a.precio)):''}${a.transaccion?' · Tx '+esc(a.transaccion):''}</span>
        ${a.serie ? `<div><span class="ap-serie">N° ${esc(a.serie)}</span></div>` : ''}
        ${a.tipo==='traspaso' ? `<div class="ap-traspaso">🚚 ${a.origen ? 'De '+esc(a.origen) : 'De otra tienda'}${
            a.promesa ? ' · ' + (a.diasTarde > 0
              ? `<b class="tarde">prometido hace ${a.diasTarde} día${a.diasTarde!==1?'s':''}</b>`
              : 'para el '+esc(a.promesa)) : ''}</div>` : ''}
        <div style="font-size:10.5px;color:#aaa;margin-top:3px">
          ${a.fecha ? `💵 Cobrado el ${esc(fechaCortaAp_(a.fecha))}` : ''}

          ${a.entregado ? `${a.fecha ? ' · ' : ''}📦 Entregado el ${esc(fechaCortaAp_(a.entregado))}${a.entregadoPor?' por '+esc(a.entregadoPor):''}` : ''}
        </div>
      </div>
      <span class="ap-est${cls}">${esc(est)}</span>
    </div>
    ${acciones}
  </div>`;
}

/* «2026-07-31 14:23» o «2026-07-31» -> «31 jul». Lo importante de estas dos
   fechas es la DISTANCIA entre ellas, no la hora: un apartado cobrado en julio
   y entregado en agosto se lee de un vistazo, y esa diferencia es la que
   explica por qué su ticket no está en el corte de hoy.

   Se parte el texto en vez de usar `new Date(...)`: la cadena viene sin zona
   horaria, y el navegador la interpretaría como UTC — en México eso adelanta
   la fecha seis horas y una venta de las 8 pm sale al día siguiente. Es el
   mismo motivo por el que las fechas se calculan en hora de México en la base. */
function fechaCortaAp_(txt){
  const m = String(txt || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return String(txt || '');
  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return Number(m[3]) + ' ' + (MESES[Number(m[2]) - 1] || m[2]);
}

/* ---- Ligar la pieza física al cliente ----
   Dos momentos distintos y a propósito separados: ASIGNAR es apartar la caja
   cuando llega el embarque —el equipo sigue en bodega—, ENTREGAR es que salió
   con el cliente. Con un solo paso no habría forma de saber cuánta mercancía
   está comprometida pero todavía en la tienda, que es lo que hay que saber el
   día que llega el pedido.

   El escaneo NO vive aquí: lo hace Captura de Series, que ya tiene cámara,
   lector de código de barras y OCR de respaldo. Duplicar ese motor en el
   tablero sería mantener dos lectores que se van a separar. */
function _apPorId(id){ return APARTADOS.filter(function(a){ return String(a.id)===String(id); })[0]; }

function asignarSerie(id){
  const a = _apPorId(id); if(!a) return;
  location.href = 'captura_series.html?apartado=' + encodeURIComponent(id) +
                  '&accion=asignar&volver=tablero.html%23preventa';
}

function entregarApartado(id){
  const a = _apPorId(id); if(!a) return;
  if(!a.serie){ alert('Primero asigna la serie del equipo.'); return; }
  /* Se manda a escanear otra vez en vez de confirmar con un botón: la
     verificación no es que el asesor recuerde la serie, es que el aparato que
     tiene en la mano SEA el de este cliente. Con cinco Orange Ocean iguales en
     la bodega, confirmar de memoria es entregar la pieza de otro. */
  location.href = 'captura_series.html?apartado=' + encodeURIComponent(id) +
                  '&accion=entregar&volver=tablero.html%23preventa';
}

function cancelarApartado(id){
  const a = _apPorId(id); if(!a) return;
  if(!confirm('¿Cancelar el apartado de ' + (a.cliente||'') + '?\n\nLa pieza vuelve al cupo' +
              (a.serie ? ' y la serie ' + a.serie + ' se libera para otro cliente.' : '.'))) return;
  sbEscribir('apartado_estatus', { p_id: Number(id), p_estatus: 'Cancelado' }).then(function(d){
    if(d && d.ok === true){ cargarApartadosNube(); }
    else { alert('No se pudo cancelar: ' + ((d && d.error) || 'sin conexión')); }
  });
}
/* ── La sección de Apartados (8-ago-2026) ────────────────────────────────
   Sustituye a la de Preventa. Las doce tarjetas con cupo para apartar Pura 90S
   se retiraron: los equipos llegaron —24 piezas en piso— y ese modelo se vende
   desde Precios como cualquier otro. El cupo existía para no prometer más de lo
   que iba a llegar; ya llegó.

   Lo que sobrevive son las ENTREGAS, y ahí una preventa y un traspaso son la
   misma cosa: alguien pagó, el equipo no estaba, hay que dárselo con su serie.
   Por eso van en la misma lista y solo se distinguen por el filo de color. */
function seccionApartados(){
  const vivos = APARTADOS.filter(a => String(a.estatus||'').toLowerCase() !== 'cancelado');
  const es = a => String(a.estatus||'Apartado').toLowerCase();

  // Lo que se pasó de fecha va PRIMERO. Es lo único de este flujo que se
  // convierte en queja, y al fondo de la lista no lo ve nadie.
  const tarde     = vivos.filter(a => es(a)!=='entregado' && a.diasTarde > 0);
  const sinSerie  = vivos.filter(a => es(a)!=='entregado' && !a.serie && !(a.diasTarde > 0));
  const listos    = vivos.filter(a => es(a)!=='entregado' && a.serie && !(a.diasTarde > 0));
  const entregados= APARTADOS.filter(a => es(a)==='entregado');
  const cancelados= APARTADOS.filter(a => es(a)==='cancelado');

  let html = '';
  if(CARGAS.apartados !== 'ok'){
    html += `<div class="pv-banner"><div class="pv-banner-n">⏳ Confirmando los apartados con la nube — puede faltar alguno</div></div>`;
  }
  if(tarde.length){
    html += `<div class="aviso-franja" style="margin:0 16px 12px">
      <h4>⏰ Se pasó la fecha prometida</h4>
      <div class="af-item">${tarde.length===1?'Un cliente lleva':'Estos clientes llevan'} esperando más de lo que se le dijo.
      <span class="af-det">Vale más una llamada avisando del retraso que una queja después.</span></div>
    </div>`;
    html += `<div class="grupo-titulo">⏰ Se pasó la fecha (${tarde.length})</div>`;
    html += tarde.map(cardApartado).join('');
  }
  if(sinSerie.length){
    html += `<div class="grupo-titulo" style="margin-top:18px">📦 Falta ligar el equipo (${sinSerie.length})</div>`;
    html += sinSerie.map(cardApartado).join('');
  }
  if(listos.length){
    html += `<div class="grupo-titulo" style="margin-top:18px">✅ Listos para entregar (${listos.length})</div>`;
    html += listos.map(cardApartado).join('');
  }
  if(entregados.length){
    html += `<div class="grupo-titulo" style="margin-top:18px">🎉 Entregados (${entregados.length})</div>`;
    html += entregados.map(cardApartado).join('');
  }
  if(cancelados.length){
    html += `<div class="grupo-titulo" style="margin-top:18px">Cancelados (${cancelados.length})</div>`;
    html += cancelados.map(cardApartado).join('');
  }
  if(!APARTADOS.length){
    html += `<div class="empty">No hay nada apartado.<br>
      Para apartar, busca el producto en Precios y usa «Apartar para un cliente».</div>`;
  }
  return html;
}
let _apartSku = null, _apartCtx = null;

/* Sirve para los dos casos y por eso recibe el producto: en la preventa salía
   de la lista fija de la Pura 90S, pero un traspaso puede ser cualquier SKU del
   catálogo. Si no se le pasa nada, se busca en el inventario. */
function abrirApartado(sku, prodEnc, precio){
  _apartSku = sku;
  const inv = invBySku[sku] || {};
  const producto = prodEnc ? decodeURIComponent(prodEnc) : (inv.producto || ('SKU '+sku));
  /* El precio se busca en TRES sitios, en este orden: el que manda la tarjeta,
     el del catálogo, y el de la promoción vigente.
     El tercero se añadió el 8-ago-2026. Un SKU que dejó de ser vigente pierde
     su importe en el catálogo —el informe ya no lo lista— pero puede seguir con
     promo en curso, que es el precio al que de verdad se está vendiendo. Sin
     mirar ahí, el apartado se guardaba sin monto y había que teclearlo. */
  const promo = PROMOS.find(p => p.sku === sku);
  const px = Number(precio) || Number(inv.precio)
             || Number(promo && (promo.pp || promo.pr)) || 0;
  _apartCtx = { producto, precio: px, tipo: 'traspaso' };

  document.getElementById('apModalTitle').textContent = 'Apartar para un cliente';
  document.getElementById('apModalSub').textContent = producto + (px ? ' · '+money(px) : '');
  /* El precio solo se pregunta cuando NO se sabe por ningún lado. Es el último
     recurso, no un paso más del formulario: si el tablero lo conoce, teclearlo
     sería pedirle al asesor que copie algo que ya está en pantalla, con el
     riesgo de que se equivoque. */
  document.getElementById('apPrecioBox').style.display = px ? 'none' : '';
  document.getElementById('apPrecio').value = '';
  document.getElementById('apTraspaso').style.display = '';
  document.getElementById('apOrigen').value = '';
  // Por defecto, para dentro de tres días: es lo que suele tardar un traspaso y
  // evita que se quede sin fecha, que es lo que impide avisar de un retraso.
  const d = new Date(); d.setDate(d.getDate()+3);
  document.getElementById('apPromesa').value =
    d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  document.getElementById('apCliente').value='';
  document.getElementById('apTel').value='';
  /* El vendedor sale de la sesión, no se teclea: es la misma persona que entró
     con su número de empleado. Se muestra para que se vea a nombre de quién
     queda, pero no se puede cambiar — cambiarlo sería registrar una venta a
     nombre de otro. */
  document.getElementById('apVend').textContent = YO && YO.nombre ? YO.nombre : '⚠️ sin sesión de empleado';
  document.getElementById('apTransaccion').value='';
  document.getElementById('apSeguro').checked=false;
  document.getElementById('apModal').classList.add('show');
  _apartBorradorRestaurar(sku);
}

/* ── El apartado a medio llenar sobrevive al cambio de app ──────
   Llenar esto lleva su rato: nombre, teléfono, de qué tienda viene, para
   cuándo. Y a media captura es normal irse a WhatsApp a confirmarle al cliente
   la fecha, o al POS por el número de ticket. Si Android descarta la app en
   ese momento, se vuelve a empezar con el cliente enfrente.

   Se guarda por SKU: dos apartados distintos no se pisan el borrador. */
const AP_BORRADOR = 'hes_apartado_borrador';
const AP_CAMPOS = ['apOrigen','apPromesa','apCliente','apTel','apTransaccion'];
function _apartBorradorGuardar(){
  if(!_apartSku) return;
  const d = { sku:_apartSku, ts:Date.now(), seguro:document.getElementById('apSeguro').checked };

function guardarApartado(){
  const sku=_apartSku; if(!sku) return;
  const cliente=document.getElementById('apCliente').value.trim();
  const tel=document.getElementById('apTel').value.trim();
  const vend = (YO && YO.nombre) ? YO.nombre : '';
  if(!vend){
    // Sin nombre, el apartado no cuenta para el attach de nadie ni se sabe quién
    // lo hizo. Mejor parar que guardar una venta huérfana.
    alert('No se pudo identificar quién eres.' + String.fromCharCode(10,10) + 'Sal y vuelve a entrar con tu número de empleado.');
    return;
  }
  const transaccion=document.getElementById('apTransaccion').value.trim();
  const seguro=document.getElementById('apSeguro').checked?'Si':'No';
  if(!cliente){ alert('Escribe el nombre del cliente.'); return; }
  const btn=document.getElementById('apGuardar'); btn.disabled=true; btn.textContent='Guardando…';
  /* En `color` va el producto ENTERO, no solo el color: "Pura 90S Pro Max
     12/512GB · Negro". Antes se guardaba solo "Negro" y, al abrir la hoja o
     Supabase, no había forma de saber si era Pro o Pro Max — se deducía por el
     precio, que es justo lo que no debe hacer quien entrega el equipo.

     Decidido así el 4-ago-2026 para tenerlo hoy mismo: la alternativa era un
     campo propio, y eso obliga a tocar el Apps Script, la hoja y Supabase.
     El precio de esta vía: el campo Color ya no contiene solo el color, así que
     si algún día alguien quiere filtrar o contar por color, tendrá que partir
     el texto por el "·". Está aquí escrito para que no le pille por sorpresa. */
  const producto = (_apartCtx && _apartCtx.producto) || ('SKU '+sku);
  const origen  = (document.getElementById('apOrigen')||{}).value || '';
  const promesa = (document.getElementById('apPromesa')||{}).value || null;
  /* Cuando el campo está a la vista, manda lo que se tecleó: se enseña
     justamente porque el precio del catálogo no sirve para este apartado. Si
     está oculto, el del catálogo es el bueno y no hay nada que teclear. */
  const cajaPrecio = document.getElementById('apPrecioBox');
  const tecleado = parseFloat(String((document.getElementById('apPrecio')||{}).value || '')
                     .replace(/[^0-9.]/g,'')) || null;
  const precio = (cajaPrecio && cajaPrecio.style.display !== 'none')
    ? (tecleado || (_apartCtx && _apartCtx.precio) || null)
    : ((_apartCtx && _apartCtx.precio) || null);
  /* 7-ago-2026: va DIRECTO a Supabase; ya no pasa por la hoja.
     Lo que se gana no es velocidad, es el cupo: el trigger `apartado_cabe`
     vigila la tabla `apartados` y hasta hoy nadie insertaba ahí, así que nunca
     se disparó. El único freno contra dos asesores apartando la última pieza a
     la vez era el número de este navegador — y dos navegadores no se ven. */
  sbEscribir('apartado_guardar', {
    p_sku: sku, p_color: producto, p_cliente: cliente, p_telefono: tel,
    p_precio: precio, p_seguro: (seguro === 'Si'),
    p_vendedor: vend, p_transaccion: transaccion,
    p_tipo: 'traspaso', p_origen: origen.trim() || null, p_promesa: promesa || null
  }).then(function(data){
    btn.disabled=false; btn.textContent='Guardar apartado';
    if(data && data.ok === true){
      // el mismo texto que se acaba de mandar, para que la lista local y la
      // nube no digan cosas distintas hasta el próximo refresco
      APARTADOS.push({id:String(data.id), sku:sku, color:producto, cliente:cliente,
        telefono:tel, precio:String(precio||''), seguro:seguro, vend:vend,
        estatus:'Apartado', transaccion:transaccion, serie:'',
        tipo:'traspaso', origen:origen.trim(), promesa:promesa||'', diasTarde:null});
      cerrarApartado(); render(); cargarApartadosNube();
    } else if(data && data.error){
      // "Cupo agotado: 4 de 4 piezas ya apartadas" llega tal cual desde la
      // base. Se muestra: el asesor tiene al cliente enfrente y necesita saber
      // que esa pieza ya no existe, no un "hubo un error".
      alert('No se guardó: ' + data.error);
    } else {
      alert('Sin conexión — el apartado NO se guardó. Intenta de nuevo.');
    }
  }).catch(function(){
    btn.disabled=false; btn.textContent='Guardar apartado';
    alert('Sin conexión — el apartado NO se guardó. Intenta de nuevo.');
  });
}

function render(){

  if(tocarDia()){ refiltrarCaches(); pintarUpdated(); }

     así que basta con cerrarla una vez. Filtrar en la rama de la sección habría
