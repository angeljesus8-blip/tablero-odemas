     buscando algo, lo que quiere es ENCONTRARLO, no seguir dentro de donde
     estaba. Al borrar la búsqueda se vuelve a la sección tal cual estaba. */
  if(busqueda){
    document.getElementById('app').innerHTML = buscarEnTodo();
    return;
  }
  const f = filtroActivo;
  let html = '';

  const bundles = BUNDLES.filter(x=>coincide(x.nombre,x.sku1,x.sku2));
  const promosTodas = PROMOS.filter(x=>coincide(x.producto,x.sku));
  /* Se listan TODAS, pero separadas en dos bloques —con piezas y agotadas— no
     ordenadas dentro de uno solo: ver la sección `promo` más abajo. Una promo
     sin piezas se puede vender igual trayendo el equipo de otra tienda, y antes
     de agosto se ocultaba: el asesor no tenía dónde consultar el precio. */
  const eolAll = EOL.filter(e=>coincide(e.producto,e.sku));
  const eolListo = eolAll.filter(e=>e.estado==='listo');
  const eolPend  = eolAll.filter(e=>e.estado==='pendiente');
  const eolAgot  = eolAll.filter(e=>e.estado==='agotado');
  const inv    = (D.inventario||[]).filter(x=>coincide(x.producto,x.sku)&&((x.stock||0)>0||(x.exhibe||0)>0));
  const resurtir = RESURTIR.filter(x=>coincide(x.producto,x.sku));
  const agotados = AGOTADOS.filter(x=>coincide(x.producto,x.sku));
  const resurtirTodos = [...agotados, ...resurtir];

  if(f==='inicio'){
    const promoAct = PROMOS.filter(x=>tieneExistencia_(x.sku)).length;
    const eolList  = EOL.filter(e=>e.estado==='listo').length;
    const avisosAct= (D.avisos||[]).filter(a=>!a.d2||a.d2>=HOY_ISO).length;
    const resurtirN= RESURTIR.length + AGOTADOS.length;
    const att=attTotal(); const total=att.c+att.s;
    const pct=total>0?Math.round(att.c/total*100):0;
    const col=pct>=25?'var(--verde)':pct>=15?'var(--naranja)':'var(--rojo)';
    const barW=Math.min(pct,100);
    /* De dónde salen las ventas. Ya no se enumeran capturas contra ajustes
       manuales porque los manuales dejaron de existir: o son las de toda la
       tienda, o —sin red— solo las de este aparato, y ESO sí hay que decirlo. */
    const fuente = VENTAS_NUBE
      ? `toda la tienda<br>${VENTAS_NUBE_HORA}`
      : 'solo lo capturado<br>en <b>este</b> equipo';
    html += `<div class="card att-card">
      <div class="att-header"><span>🛡️ Assurant del día</span>
        <span class="att-fuente">${fuente}</span></div>
      <div class="att-cifra">
        <div class="att-rate" id="attRate" style="color:${col}">${total>0?pct+'%':'—'}</div>
        <div class="att-sub" id="attSub">${total>0
          ? `${att.c} con seguro<br>de ${total} venta${total!==1?'s':''} hoy ${pct>=25?'✅':'⚠️'}`
          : 'Aún sin ventas<br>registradas hoy'}</div>
      </div>
      <div class="att-prog">
        <div class="att-prog-track">
          <div class="att-prog-fill" id="attBarFill" style="width:${barW}%;background:${col}"></div>
          <div class="att-prog-goal"></div>
        </div>
        <div class="att-prog-lbl"><span>0%</span><span class="meta">▲ meta 25%</span><span>100%</span></div>
      </div>
      ${equipoHtml()}
      <button class="btn-wa" onclick="resumenWA()">📲 Compartir resumen por WhatsApp</button>
    </div>`;

    /* Los avisos van en una FRANJA arriba, no en una tarjeta más (8-ago-2026).
       Un aviso se lee al entrar; nadie navega a "Avisos" a ver si hay alguno —
       por eso llevaba tanto sin mirarse. Solo aparece cuando hay. */
    const avisosHoy = (D.avisos||[]).filter(a=>!a.d2||a.d2>=HOY_ISO);
    if(avisosHoy.length){
      html = `<div class="aviso-franja">
        <h4>📢 ${avisosHoy.length===1?'Aviso':'Avisos'} de hoy</h4>
        ${avisosHoy.slice(0,3).map(a=>`<div class="af-item">${esc(a.titulo||'')}
          ${a.detalle?`<span class="af-det">${esc(String(a.detalle).slice(0,160))}</span>`:''}</div>`).join('')}
        ${avisosHoy.length>3?`<div class="af-det" style="margin-top:6px">y ${avisosHoy.length-3} más</div>`:''}
      </div>` + html;
    }

    /* Las tarjetas sustituyen a la rejilla de números y a la barra de chips:
       cada una dice a dónde lleva Y cuánto hay dentro, así que se ve de un
       vistazo dónde hay trabajo sin tener que entrar a mirar. */
    const cuentas = { promo:promoAct, apartados:cuenta('apartados'), eol:eolList, resurtir:resurtirN };
    const subs = { promo:`${promoAct} con promo · ${sinPromoConPiezasN()} a precio regular`,
                   apartados:(function(){
                     const v=APARTADOS.filter(a=>{const e=String(a.estatus||'').toLowerCase();
                       return e!=='cancelado' && e!=='entregado';});
                     const t=v.filter(a=>a.diasTarde>0).length;
                     return t ? `${v.length} por entregar · ⏰ ${t} con la fecha pasada`
                              : `${v.length} pagados, pendientes de entregar`; })(),
                   eol:'Piezas de exhibición al 50%',
                   resurtir:'Sin existencia — hay que pedir' };
    html += `<div class="ir-grid">` + FILTROS.filter(f=>seccionTieneItems(f.id) && seccionVisible_(f.id)).map(f=>`
      <button class="ir-card" onclick="irA('${f.id}')">
        <span class="ir-ico" style="background:${f.color}1a">${f.icono}</span>
        <span class="ir-txt"><b>${f.label}</b><span>${subs[f.id]||f.sub}</span></span>
        <span class="ir-n" style="color:${(cuentas[f.id]||0)>0?f.color:'#ccc'}">${cuentas[f.id]||0}</span>
      </button>`).join('') + `</div>`;
  }
  if(f==='eol'){
    html += seccion('🏷️ Vender al 50% · pieza de exhibición', eolListo, cardEol);
    html += seccion('⏳ EOL próximos · agotar stock cerrado', eolPend, cardEol);
    html += seccion('Agotados', eolAgot, cardEol);
  }
  if(f==='apartados') html += seccionApartados();
  if(f==='promo'){
    const promoSkus = new Set(PROMOS.map(p => p.sku));
    /* Los agotados TAMBIÉN se listan (1-ago-2026). Antes el filtro exigía
       existencia, así que un producto sin piezas desaparecía con todo y su
       precio — y son justo los que el cliente pide y se traen de otra tienda.
       Van al final, para que no estorben a quien solo está hojeando, pero el
       buscador sí los encuentra.

       PERO solo los que de verdad se pueden traer (7-ago-2026). Un agotado
       marcado EOL no se va a resurtir nunca: enseñar su precio es ofrecerle al
       cliente algo que no va a llegar. Medido ese día: de 97 agotados en esta
       lista, 95 estaban marcados EOL. La pestaña decía "Precio regular (110)"
       cuando lo que se podía vender o traer eran 16.

       El criterio no es nuevo: `AGOTADOS` (l. 901) ya excluye los EOL con este
       mismo `eolSkuSet`. Esta lista era la única que no lo hacía. */
    // conPiezas_ y seConsigue_ viven fuera del render: los comparten esta
    // sección, las tarjetas de Inicio y el buscador global.
    const conPiezas = conPiezas_;
    const sinPromo = inventarioSinPromo()
      .filter(x => coincide(x.producto, x.sku) && seConsigue_(x))
      .sort((a,b) => (conPiezas_(b)?1:0) - (conPiezas_(a)?1:0));
    // El contador de "se traen de otra tienda" cuenta lo mismo: sin los EOL,
    // que no se traen de ningún lado.
    const porTraer = sinPromo.filter(x => !conPiezas(x)).length
                   + promosTodas.filter(x => !tieneExistencia_(x.sku)
                                          && !eolSkuSet.has(x.sku)).length;
    /* Las promos se parten igual que el resto: lo que hay, y lo que se trae.
       Antes iban todas en un bloque, ordenadas pero MEZCLADAS —una promo
       agotada podía quedar entre dos con piezas si el orden cambiaba—, y el
       texto de arriba decía "117 promos con existencia" cuando 37 de esas 117
       estaban agotadas. Un contador que miente es peor que no tenerlo: el
       gerente lo lee de un vistazo para saber qué puede empujar hoy. */
    const promosConPiezas = promosTodas.filter(x => tieneExistencia_(x.sku));
    // Una promo agotada Y marcada EOL no se trae de ningún lado: fuera, igual
    // que en precio regular.
    const promosAgotadas  = promosTodas.filter(x => !tieneExistencia_(x.sku)
                                                 && !eolSkuSet.has(x.sku));
    /* "sin piezas para vender", no "agotados": desde el 8-ago aquí también caen
       los que conservan la de exhibición. Hay una pieza en el aparador, pero no
       se puede vender, así que para el cliente cuenta como cero. */
    const traerTxt = porTraer > 0 ? ` · ${porTraer} sin piezas para vender (se traen de otra tienda)` : '';
    /* Si todas las promos vencen el mismo día, se dice UNA vez aquí arriba y las
       tarjetas se callan. `_vigUnica` lo lee badgeVigencia mientras se pinta la
       sección; se limpia al terminar para no arrastrarlo al buscador ni a otra
       pantalla, donde el conjunto de promos es distinto. */
    _vigUnica = vigenciaComun(promosTodas);
    html += `<div class="promo-toolbar"><span>${promosConPiezas.length} promo${promosConPiezas.length!==1?'s':''} con existencia${traerTxt}</span><button id="btnRefreshPromos" onclick="cargarPromosNube(true)">↻ Actualizar</button></div>`;
    if(_vigUnica) html += `<div class="vig-barra">${avisoVigencia(_vigUnica)}</div>`;

    /* UNA sola lista, no dos pestañas deslizables (7-ago-2026).
       Lo que se gana no es estética: **el buscador**. Con el slider, escribir
       "matepad" filtraba las dos listas pero solo se veía la que estuviera
       abierta, así que un producto podía existir, coincidir con la búsqueda y
       no aparecer — sin ninguna señal de que había que deslizar. El asesor
       concluía "no lo tenemos" con el cliente enfrente.

       Se conserva la separación por bloques con encabezados: un producto con
       promo y otro sin ella se cobran distinto, y mezclarlos sin marcar cuál es
       cuál sería peor que dos pestañas. */
    const sinPromoConPiezas = sinPromo.filter(conPiezas);
    const sinPromoAgotados  = sinPromo.filter(x => !conPiezas(x));

    /* PRIMERO todo lo que hay en tienda, DESPUÉS todo lo que hay que traer.
       Nada de mezclar: el asesor que hojea esta pantalla está buscando qué
       puede vender ahora mismo, y una tarjeta sin piezas entre dos que sí las
       tienen le hace perder el tiempo o, peor, prometer algo que no está. */
    if(promosConPiezas.length){
      html += `<div class="grupo-titulo">🔥 Con promoción (${promosConPiezas.length})</div>`;
      html += promosConPiezas.map(cardPromo).join('');
    }
    if(sinPromoConPiezas.length){
      html += `<div class="grupo-titulo" style="margin-top:18px">💰 Precio regular (${sinPromoConPiezas.length})</div>`;
      html += sinPromoConPiezas.map(cardPrecioReg).join('');
    }
    /* Los agotados que SÍ se pueden traer, todos juntos al final y bajo su
       propio título — con promo y sin ella. Cada uno conserva su tarjeta, que
       es la que sabe enseñar el precio correcto. */
    const agotadosTraibles = promosAgotadas.length + sinPromoAgotados.length;
    if(agotadosTraibles){
      html += `<div class="grupo-titulo" style="margin-top:18px">📭 Agotados · se traen de otra tienda (${agotadosTraibles})</div>`;
      html += promosAgotadas.map(cardPromo).join('');
      html += sinPromoAgotados.map(cardPrecioReg).join('');
    }
    _vigUnica = null;   // fuera de esta sección, cada tarjeta decide por su cuenta
    if(!promosConPiezas.length && !sinPromoConPiezas.length && !agotadosTraibles){
      html += `<div class="empty">${busqueda ? 'Sin resultados para «'+esc(busqueda)+'».' : 'Sin promos ni precios que mostrar.'}</div>`;
    }
  }
  if(f==='resurtir'){
    if(agotados.length) html += seccion('📭 Sin existencia — pedir urgente', agotados, rowResurtir);
    if(resurtir.length) html += seccion('🪟 Queda piso — pedir caja', resurtir, rowResurtir);
    if(RESURTIR.length || AGOTADOS.length){
      html += `<button class="btn-wa" style="margin-top:14px" onclick="resurtirWA()">📲 Compartir lista completa por WhatsApp</button>`;
    }
  }
  if(f==='inv')   html += seccion('📊 Inventario · existencias', inv, rowInv);

  if(!html.trim()) html = `<div class="empty">Sin resultados${busqueda?` para “${busqueda}”`:''}.</div>`;
  document.getElementById('app').innerHTML = html;
}

/* ================= Cola de llamadas al GAS =================
   Google Apps Script descarta las llamadas que llegan encimadas y lo hace EN
   SILENCIO (responde 200 sin ejecutar). Antes las 6 cargas salían todas en el
   mismo instante: unas llegaban y otras no, así que promos/combos/avisos se
   quedaban vacíos —y sus pestañas se ocultaban solas por seccionTieneItems()—
   sin que nadie se enterara. Ahora salen de una en una, espaciadas, con
   timeout, reintento y aviso visible si algo no llegó. */
const GAS_GAP        = 1500;    // ms de separación entre llamadas
const GAS_TIMEOUT    = 15000;   // ms de espera por respuesta
const GAS_REINTENTOS = 2;

let _gasCola = [], _gasCorriendo = false, _gasN = 0;
const espera = ms => new Promise(r=>setTimeout(r, ms));

function gasJsonp(qs){
  return new Promise(function(resolve, reject){
    // Callback único: Date.now() solo no basta, dos llamadas en el mismo
    // milisegundo se pisan y cruzan las respuestas (ya pasó en Captura de Series).
    const cb = '_gas' + Date.now() + '_' + (++_gasN);
    const sc = document.createElement('script');
    const t  = setTimeout(function(){ limpiar(); reject(new Error('timeout')); }, GAS_TIMEOUT);
    function limpiar(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = function(d){ limpiar(); resolve(d); };
    sc.onerror = function(){ limpiar(); reject(new Error('red')); };
    sc.src = CLOUD_URL + '?' + qs + '&callback=' + cb
           + (GAS_TOKEN ? '&t=' + encodeURIComponent(GAS_TOKEN) : '');
    document.head.appendChild(sc);
  });
}

// prioritario:true → se cuela al frente (para escrituras: apartados, EOL)
function gasPedir(qs, opts){
  opts = opts || {};
  return new Promise(function(resolve, reject){
    const tarea = { qs, resolve, reject, intentos:0,
      max: opts.reintentos!=null ? opts.reintentos : GAS_REINTENTOS };
    if(opts.prioritario) _gasCola.unshift(tarea); else _gasCola.push(tarea);
    _gasBombear();
  });
}

async function _gasBombear(){
  if(_gasCorriendo) return;
  _gasCorriendo = true;
  while(_gasCola.length){
    const t = _gasCola.shift();
    try{
      t.resolve(await gasJsonp(t.qs));
    }catch(e){
      if(t.intentos < t.max){
        t.intentos++;
        _gasCola.unshift(t);                      // reintenta antes que el resto
        await espera(GAS_GAP * (t.intentos + 1)); // ...dándole más aire cada vez
        continue;
      }
      t.reject(e);
    }
    if(_gasCola.length) await espera(GAS_GAP);
  }
  _gasCorriendo = false;
}

/* ---- Estado de las cargas + aviso al usuario ---- */
/* `ventas` entró aquí el 17-ago-2026, y es lo que faltaba: el leaderboard de
   Assurant era la única carga que podía quedarse vieja SIN que el banner dijera
   nada. Con la doble escritura viva no se notaba —la hoja y Supabase decían lo
   mismo— pero al apagarla, un fallo aquí no daría error: daría un porcentaje.
   Y ese porcentaje es el KPI que se reporta con meta del 25 %. */
const CARGAS = { inventario:'pendiente', eol:'pendiente', promos:'pendiente',
                 bundles:'pendiente', avisos:'pendiente', apartados:'pendiente',
                 ventas:'pendiente' };
const CARGA_NOMBRE = { inventario:'inventario', eol:'EOL', promos:'promos',
                       bundles:'combos', avisos:'avisos', apartados:'apartados',
                       ventas:'Assurant del día' };
function marcarCarga(k, ok){ CARGAS[k] = ok ? 'ok' : 'error'; actualizarBanner(); }

function actualizarBanner(){
  const w = document.getElementById('liveWarning');
  const t = document.getElementById('liveWarningTitulo');
  const m = document.getElementById('liveWarningMsg');
  if(!w || !t || !m) return;
  const btn = '<button class="lw-btn" onclick="reintentarCargas()">↻ Reintentar</button>';
  if(CARGAS.inventario === 'error'){
    w.className = 'visible err';
    t.textContent = 'Sin conexión al inventario';
    m.innerHTML = 'No se pudo confirmar el stock — <b>los números que ves pueden estar desactualizados</b>.<br>' + btn;
    return;
  }
  if(CARGAS.inventario === 'pendiente'){
    w.className = 'visible';
    t.textContent = 'Inventario sin confirmar';
    m.innerHTML = 'Conectando… no cotices piezas al cliente hasta ver <b style="color:var(--verde)">● en vivo</b> arriba';
    return;
  }
  const fallidas = Object.keys(CARGAS).filter(k=>CARGAS[k]==='error').map(k=>CARGA_NOMBRE[k]);
  if(fallidas.length){
    w.className = 'visible';
    t.textContent = 'Faltan datos por cargar';
    m.innerHTML = 'No cargó: <b>' + fallidas.join(', ') + '</b>. Esas pestañas pueden verse vacías o incompletas.<br>' + btn;
    return;
  }
  w.className = '';
}

function reintentarCargas(){
  const mapa = { inventario:cargarInventarioNube, eol:cargarEolNube, promos:cargarPromosNube,
                 bundles:cargarBundlesNube, avisos:cargarAvisosNube, apartados:cargarApartadosNube,
                 ventas:cargarVentasNube };
  Object.keys(CARGAS).forEach(function(k){
    if(CARGAS[k] === 'error'){ CARGAS[k] = 'pendiente'; mapa[k](); }
  });
  actualizarBanner();
}

/* ---- Antigüedad del inventario ----
   Con la PWA abierta varios días, "Live 09:12" del martes se ve idéntico al de
   hoy. Si la última confirmación no es de hoy, se dice con todas sus letras. */
let _invFecha = null;      // Date de la última confirmación de inventario
let _ultimaCarga = 0;      // ms de la última carga con éxito
let _ultimoIntento = 0;    // ms del último intento (con o sin éxito)

function pintarUpdated(){
  const el = document.getElementById('updated');
  if(!el) return;
  // Sin respuesta de la nube pero con inventario guardado: se muestra, diciendo
  // de cuándo es. Que nadie prometa una pieza creyendo que el dato es de hoy.
  if(!_invFecha && _invEdadHoras != null){
    const h = Math.round(_invEdadHoras);
    const txt = h < 1 ? 'hace un rato' : (h < 24 ? 'hace ' + h + ' h' : 'hace ' + Math.floor(h/24) + ' d');
    const color = _invEdadHoras <= INV_HORAS_OK ? 'var(--naranja)' : 'var(--rojo)';
    el.innerHTML = 'Guardado<b style="color:' + color + ';display:block;font-size:11px">● ' + txt + ' · confirma en sistema</b>';
    return;
  }
  if(!_invFecha) return;
  const t = _invFecha.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  if(hoyISO(_invFecha) === HOY_ISO){
    el.innerHTML = 'Live ' + t + '<b style="color:var(--verde);display:block;font-size:11px">● en vivo</b>';
  }else{
    const dia = _invFecha.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
    el.innerHTML = dia + ' ' + t + '<b style="color:var(--naranja);display:block;font-size:11px">● no es de hoy</b>';
  }
}

/* ---- Aplicadores ----
   Separados de las funciones que piden los datos, porque la misma respuesta
   puede llegar por una llamada suelta (modo=inventario) o dentro del paquete
   completo (modo=todo). */
const _esObj = d => d && typeof d === 'object' && !Array.isArray(d);
/* Desde que el Apps Script exige token, un rechazo llega como
   {error:'no_autorizado'} — que TAMBIÉN es un objeto y pasaba _esObj. El
   tablero lo tomaba por datos buenos, se marcaba "en vivo" con todo en cero y
   pisaba el inventario guardado. */
const _esError = d => _esObj(d) && typeof d.error === 'string';
const _datosUtiles = d => _esObj(d) && !_esError(d) && Object.keys(d).length > 0;

function aplicarInventario(data){
  (function(data){
    // Guarda los datos crudos de la nube; el stock cerrado y la exhibición
    // restante se calculan en calcDerivados (finalizarStock), que corre también
    // cuando llegan los datos de EOL.
    function rawFields(cl){
      return {
        _onhand:    cl.o || 0,
        _vendido:   cl.v || 0,
        _exhibeRaw: (typeof cl.e === 'number') ? cl.e : 0,
        _ev:        cl.ev || 0
      };
    }
    (D.inventario||[]).forEach(function(item){
      const cl = data[item.sku];
      if(cl && typeof cl.o === 'number'){
        Object.assign(item, rawFields(cl));
        if(cl.p && !item.precio) item.precio = parseFloat(String(cl.p).replace(/[^0-9.]/g,''))||0;
      }
    });
    // Agrega al inventario local los SKUs que el GAS conoce (Catalogo o Catalogo_ref)
    // pero que no están en datos.js — esto incluye productos agotados que ya no vienen
    // en el Excel de Sonar pero el GAS los conserva vía Catalogo_ref
    const skusLocales = new Set((D.inventario||[]).map(function(x){ return x.sku; }));
    Object.keys(data).forEach(function(sku){
      if(skusLocales.has(sku)) return;
      const cl = data[sku];
      if(!cl || !cl.d) return; // sin descripción → SKU vacío, ignorar
      const item = Object.assign({
        sku: sku,
        producto: cl.d,
        precio:   parseFloat(String(cl.p||'').replace(/[^0-9.]/g,''))||0
      }, rawFields(cl));
      if(!D.inventario) D.inventario = [];
      D.inventario.push(item);
      invBySku[sku] = item;
    });
    // Actualiza invBySku para SKUs EOL que no están en D.inventario
    (D.eol||[]).forEach(function(e){
      if(invBySku[e.sku]) return;
      const cl = data[e.sku];
      if(!cl) return;
      invBySku[e.sku] = Object.assign({
        sku: e.sku, producto: cl.d||'',
        precio: parseFloat(String(cl.p||'').replace(/[^0-9.]/g,''))||0
      }, rawFields(cl));
    });
    D._invCloud = true;

function aplicarEol(data){
  const skusLocales = new Set((D.eol||[]).map(function(e){ return e.sku; }));
  data.forEach(function(e){
    if(skusLocales.has(e.sku)) return;

    (D.eol = D.eol||[]).push({ sku: e.sku, precio: parseFloat(e.precio)||0 });
    eolSkuSet.add(e.sku);

function aplicarPromos(data){
  const todas = Object.keys(data).map(function(sku){
    const p = data[sku] || {};
    const inv = invBySku[sku];
    return { sku:sku, producto:p.d||(inv && inv.producto)||('SKU '+sku),
      pr:(p.pr!=null?p.pr:null), pp:(p.pp!=null?p.pp:null), d1:p.d1||null, d2:p.d2||null };
  });
  // Se cachea la lista COMPLETA (no la filtrada): así, al cambiar el día, las
  // vigencias se recalculan desde el caché aunque el celular esté sin red.
  try{ localStorage.setItem(PROMOS_KEY, JSON.stringify(todas)); }catch(e){}   // cuota llena: se sigue con lo que hay en memoria
  PROMOS = todas.filter(vigenteHoy)
                .sort(function(a,b){ return a.producto.localeCompare(b.producto); });
}

function aplicarBundles(data){
  try{ localStorage.setItem(BUNDLES_KEY, JSON.stringify(data)); }catch(e){}   // cuota llena: se sigue con lo que hay en memoria
  BUNDLES = data.filter(vigenteHoy);
}

/* Vuelve a filtrar promos y combos desde el caché — para cuando cambió el día
   sin que haya habido una carga nueva de la nube. */
function refiltrarCaches(){
  try{
    const c = JSON.parse(localStorage.getItem(PROMOS_KEY)||'null');
    if(Array.isArray(c)) PROMOS = c.filter(vigenteHoy)
      .sort(function(a,b){ return a.producto.localeCompare(b.producto); });
  }catch(e){}   // si el cache no se puede releer, quedan las promos ya filtradas
  try{
    const b = JSON.parse(localStorage.getItem(BUNDLES_KEY)||'null');
    if(Array.isArray(b)) BUNDLES = b.filter(vigenteHoy);
  }catch(e){}   // idem: quedan los combos ya filtrados
}

function aplicarAvisos(data){
  const locales = new Set((D.avisos||[]).map(function(a){ return a.titulo; }));
  data.forEach(function(a){

    (D.avisos = D.avisos||[]).unshift(a);

/* ---------- FASE 2 · leer de Supabase, con el Apps Script de respaldo ----------
   4-ago-2026. Medido en este mismo tablero: `modo=todo` tarda entre 5 y 8
   segundos y `tablero_todo` entre 0.18 y 0.37. La diferencia no es la base de
   datos: es que el Apps Script descarta las llamadas encimadas respondiendo
   200, y por eso hay una cola con 1.5 s de separación.

   Supabase devuelve filas y las funciones aplicar* de aquí abajo esperan los
   objetos indexados del GAS. Se traduce en `_deSupabase` en vez de tocarlas:
   son las que pintan el stock y ya están probadas en piso.

   El adaptador se comparó contra `modo=todo` con los mismos datos antes de
   escribir una sola línea aquí: 215 SKUs sin diferencia en onhand, vendido,
   exhibición ni exh_vendida; 117 promos; los 9 apartados con su número de
   ticket. Si algo de esto se toca, se vuelve a comparar. */
const SB_URL = 'https://rjdrljtujbwooejrpyqv.supabase.co';
const SB_KEY = 'sb_publishable_mELjDmCaFpNOxcwPi5MB2A_qSZ5ZA2z';

/* Una llamada a Supabase con los parámetros que hagan falta. `p_store` va
   siempre: ninguna función de la base contesta sin saber de qué tienda habla.
   Devuelve null —nunca lanza— para que quien llama decida si cae al Apps
   Script o si avisa; un throw aquí tumbaría el arranque del tablero. */
/* La llamada pelada, con los parámetros EXACTOS que se le pasen. Casi nada la
   usa directamente: existe porque no todas las funciones de la base hablan de
   una tienda —`login_empleado` recibe un número de empleado y nada más—, y
   colarle un `p_store` que no está en su firma hace que PostgREST no la
   encuentre y responda 404. Un 404 aquí devuelve null igual que un corte de
   red, así que se vería como "sin conexión" y no como "la llamada está mal". */
async function sbCallRaw(fn, params, ms){
  const ctl = new AbortController();
  const t = setTimeout(function(){ ctl.abort(); }, ms || 8000);
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST', signal: ctl.signal,
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(params || {})
    });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }        // sin red, timeout o rechazo: se cae al GAS
  finally{ clearTimeout(t); }
}
async function sbCall(fn, params, ms){
  return sbCallRaw(fn, Object.assign({ p_store: String(TIENDA_ID || '') }, params || {}), ms);
}
async function sbRpc(fn, ms){ return sbCall(fn, null, ms); }

/* ── Que el permiso no se quede congelado en el teléfono ────────────────
   `hes_empleado` se escribe UNA vez, al entrar, y no se vuelve a refrescar.
   Sin esto, cambiar un puesto en Admin → Equipo no llegaría hasta que esa
   persona cerrara sesión y volviera a entrar — y nadie cierra sesión: la app
   recuerda al usuario. Es el mismo fallo que dejó a los asesores dos días sin
   poder capturar (ver el comentario de `queFaltaEnLaSesion` en index.html).

   Corrige en LAS DOS direcciones a propósito. Solo quitar sería más "seguro" y
   estaría mal: ascender a alguien y que no vea lo suyo no da ningún error, y
   nadie relacionaría el síntoma con que su teléfono guarda el puesto viejo.

   Se reusa `login_empleado`, que es la misma función del login y ya devuelve el
   puesto: una función nueva sería un segundo sitio donde vive la respuesta a
   "¿qué puesto tiene esta persona?", y esos dos sitios se separan solos.

   Si no hay red no pasa nada: se queda lo que decidió el arranque, que es lo
   que había hasta hoy. */
async function confirmarPuesto(){
  if(!YO || !YO.empno) return;      // gerente dueño: su permiso es la sesión
  const r = await sbCallRaw('login_empleado', { p_pin: String(YO.empno) }, 8000);
  const f = Array.isArray(r) ? r[0] : r;
  if(!f || !f.emp_puesto) return;   // sin respuesta útil no se toca nada
  const antes = PUEDE_GESTIONAR;
  PUEDE_GESTIONAR = esPuestoDeGestion_(f.emp_puesto);
  if(f.emp_puesto !== YO.puesto){
    YO.puesto = f.emp_puesto;
    // Se guarda para que el próximo arranque ya nazca bien, aunque sea sin red
    try{ localStorage.setItem('hes_empleado', JSON.stringify(YO)); }
    catch(e){ /* almacenamiento lleno o bloqueado: se vuelve a preguntar mañana */ }
  }
  if(antes !== PUEDE_GESTIONAR) render();   // aparece o desaparece sin recargar
}

/* Las escrituras de preventa llevan el token de tienda, el mismo secreto que
   ya protegía al Apps Script. Sale de la sesión (login_asesor lo devuelve), y
   por eso NO está escrito en este archivo, que es público. Sin token la base
   responde `no_autorizado` — a propósito: la anon key sola no debe escribir. */
function sbEscribir(fn, params){
  return sbCall(fn, Object.assign({ p_token: GAS_TOKEN }, params || {}), 12000);
}

/* Una fila de `apartados_lista` → la forma que usan cardApartado y el cupo.
   Vive suelta porque la usan DOS caminos: el viaje único (`tablero_todo`) y la
   recarga después de escribir (`cargarApartadosNube`). Si se copiara en cada
   uno, el día que se agregue un campo se agregaría en uno solo y el otro lo
   perdería en silencio — que es justo lo que pasó con `transaccion` en agosto. */
function _apartadoDeSupabase(a){
  // `transaccion` es el ticket del POS: el enlace entre el apartado y la
  // venta. Si se cae de aquí, se pierde sin que nada avise.
  return { id:String(a.id), sku:a.sku, color:a.color||'', cliente:a.cliente,
           telefono:a.telefono||'', precio: a.precio!=null ? String(a.precio) : '',
           seguro: a.con_seguro ? 'Si' : '', vend:a.vendedor||'',
           estatus:a.estatus||'Apartado', transaccion:a.transaccion||'',
           serie:a.serie||'',
           asignado: a.asignado_en ? String(a.asignado_en).slice(0,10) : '',
           entregado: a.entregado_en ? String(a.entregado_en).slice(0,10) : '',
           entregadoPor: a.entregado_por||'',
           tipo: a.tipo||'preventa',
           origen: a.origen||'',
           promesa: a.promesa||'',
           // Los días de retraso los calcula la base, no el celular: un
           // teléfono con la fecha mal decidiría a qué cliente llamar.
           diasTarde: (a.dias_tarde==null ? null : Number(a.dias_tarde)),
           fecha: a.creado_en ? String(a.creado_en).slice(0,16).replace('T',' ') : '' };
}

/* Supabase → la forma que ya consumen aplicarInventario, aplicarPromos, etc. */
function _deSupabase(d){
  const inv = {};
  (d.inventario||[]).forEach(function(x){
    inv[x.sku] = { d:x.descripcion, o:x.onhand, v:x.vendido,
                   e:x.exhibicion, ev:x.exh_vendida, p:x.precio };
  });
  const pro = {};
  (d.promos||[]).forEach(function(p){
    pro[p.sku] = { d:p.producto, pr:p.precio_reg, pp:p.precio_pro,
                   est:p.estatus, msi:p.msi, d1:p.vigente_desde, d2:p.vigente_hasta };
  });
  const vend = _vendDeSupabase(d.ventas_hoy);
  return {
    inventario: inv,
    promos: pro,
    eol: (d.eol||[]).map(function(e){
      return { sku:e.sku, precio: e.precio!=null ? e.precio : e.precio_efectivo }; }),
    bundles: (d.bundles||[]).map(function(b){
      return { id:String(b.id), nombre:b.nombre,
               // en Supabase skus es un array de verdad; aquí se espera "a,b,c"
               skus: Array.isArray(b.skus) ? b.skus.join(',') : String(b.skus||''),
               precio:b.precio, d1:b.vigente_desde, d2:b.vigente_hasta }; }),
    avisos: (d.avisos||[]).map(function(a){
      /* `tipo` venía fijo en 'manual' desde la fase 2, y no por decisión: la
         tabla de Supabase no tenía la columna, así que no había de dónde
         sacarla. Efecto: los avisos de corporativo perdieron su etiqueta azul
         CEA/LEA en el tablero —cardAviso, l. 1354— y quedaron indistinguibles
         de un recado interno. Nadie lo reportó porque el aviso se sigue
         leyendo; solo pierde la señal de quién lo manda.
         Columna agregada en supabase_escrituras_resto.sql. */
      return { id:String(a.id), titulo:a.titulo, detalle:a.detalle||'',
               fecha: a.creado_en ? String(a.creado_en).slice(0,10) : '',
               d2:a.vigente_hasta, prioridad:a.prioridad||'normal',
               tipo:a.tipo||'manual' }; }),
    apartados: (d.apartados||[]).map(_apartadoDeSupabase),
    ventas_hoy: { vend: vend },
    // Marca de origen. La lee aplicarTodo para saber si puede confiar en los
    // apartados: los del Apps Script vienen de una hoja que ya nadie escribe.
    __sb: true
  };
}

async function cargarTodoSupabase(){
  const bruto = await sbRpc('tablero_todo');
  // Se revisa la FORMA, no solo que llegue: una respuesta rara vale menos que

  if(!_esObj(bruto) || !Array.isArray(bruto.inventario) || !bruto.inventario.length) return false;

}

/* Todo en un solo viaje (~4 s contra ~20 s de las seis llamadas). Si este GAS
   no tiene el modo, contesta con la lista de ventas —su else final— así que hay

async function cargarTodoNube(){

  try{
    d = await gasPedir('modo=todo', { reintentos:1 });
    if(!_esObj(d) || !_esObj(d.inventario)) throw new Error('sin modo=todo');
  }catch(e){ return false; }

/* Lo comparten las dos rutas a propósito: el que pinta el stock es el mismo
   código venga de donde venga el dato. Si se duplicara, tarde o temprano una
   de las dos ramas se quedaría atrás y el tablero mostraría cosas distintas
   según qué nube haya contestado. */
function aplicarTodo(d){
  /* El STOCK solo se acepta de Supabase, desde el 7-ago-2026.
     El Excel del día se sube directo a Supabase: la hoja dejó de recibirlo, así
     que el `modo=todo` del Apps Script devuelve el On Hand del último informe
     que pasó por ahí — que se va quedando más viejo cada día que pasa.

     Y un stock viejo no es un dato incompleto: es un dato FALSO. Dice que hay
     piezas que ya se vendieron, y el asesor le promete al cliente algo que no
     está. Sin stock el tablero avisa (el banner naranja); con stock inventado,
     no avisa nadie.

     Los PRECIOS sí siguen cayendo al Apps Script: una promo de hace unos días
     casi siempre sigue vigente, y quedarse sin precios deja al asesor sin poder
     vender. El dato viejo hace daño en el stock, no en el precio. */
  if(d.__sb){ aplicarInventario(d.inventario);                 marcarCarga('inventario', true); }
  if(Array.isArray(d.eol))       { aplicarEol(d.eol);          marcarCarga('eol', true); }
  if(_esObj(d.promos))           { aplicarPromos(d.promos);    marcarCarga('promos', true); }
  if(Array.isArray(d.bundles))   { aplicarBundles(d.bundles);  marcarCarga('bundles', true); }
  if(Array.isArray(d.avisos))    { aplicarAvisos(d.avisos);    marcarCarga('avisos', true); }
  /* Los apartados SOLO se aplican si vienen de Supabase (`d.__sb`).
     `modo=todo` del Apps Script también los trae, pero desde el 7-ago los lee
     de una hoja que ya nadie escribe. Y llega ~7 s DESPUÉS que Supabase: sin
     este candado, la respuesta lenta borraría de la pantalla el apartado que el
     asesor acaba de guardar, o le devolvería la serie a un equipo ya entregado.
     No da error, solo deshace trabajo — por eso se marca el origen. */
  if(d.__sb && Array.isArray(d.apartados)) { APARTADOS = d.apartados; marcarCarga('apartados', true); }
  /* Las ventas del día, SOLO de Supabase — mismo candado que el stock y los
     apartados, y por el mismo motivo (17-ago-2026).

     El `modo=todo` del Apps Script también trae `ventas_hoy`, pero de la hoja.
     Hoy coinciden; en cuanto se apague la doble escritura, esa mitad de la
     respuesta queda congelada y pisaría el Assurant bueno que Supabase acaba de
     entregar — porque además llega ~7 s DESPUÉS. Sería el caso de los apartados
     otra vez: la respuesta lenta deshaciendo el trabajo de la rápida.

     Sin el candado esto no avisaría de nada: un attach del 40 % de anteayer se
     ve igual de creíble que el de hoy. Con él, si el dato no viene de Supabase
     la carga se marca fallida y el banner lo nombra. */
  marcarCarga('ventas', d.__sb ? aplicarVentas(d.ventas_hoy) : false);
  calcDerivados();
  render();
  return true;
}

let _refrescando = false;
async function refrescarNube(){
  if(_refrescando) return;
  _refrescando = true;
  _ultimoIntento = Date.now();
  try{
    /* Supabase primero: un viaje y sin cola (~0,25 s contra ~7 s).
       El Apps Script queda de respaldo mientras dure la migración.

       Esto estuvo apagado unas horas el 4-ago y se volvió a encender el mismo
       día, cuando la fase 3 lo hizo correcto. Merece la pena recordar por qué,
       porque es el error más fácil de repetir:

       `inventario_vivo` calcula lo vendido a partir de la tabla `ventas`. Con
       las ventas escribiéndose SOLO en el Sheet, Supabase únicamente conocía
       las de la última `resincronizar()`, y el tablero mostraba **una pieza de
       más** por cada venta del día. No lo traía Supabase: lo traía leer de un
       lado lo que se escribe en el otro.

       Ahora cada venta va a los dos lados en cuanto el Sheet confirma, y lo que
       falle por red se reintenta desde la cola de Captura de Series. Si esa
       cola se quedara atascada, esto volvería a inflar el stock — es lo primero
       que hay que mirar si el inventario no cuadra. */
    if(await cargarTodoSupabase()) return;
    /* Supabase no contestó. El Apps Script sirve para todo lo demás, pero YA NO
       para los apartados: su `modo=todo` los saca de la hoja, que desde el
       7-ago no recibe preventa. Así que se pide la preventa aparte —otra vez a
       Supabase, por si fue un timeout suelto—, y si tampoco esta vez, la carga
       queda marcada como fallida y el banner lo dice. Mejor "no prometas la
       última pieza" que un cupo inventado. */
    if(await cargarTodoNube()){ cargarApartadosNube(); return; }
    // Respaldo: de una en una y espaciadas, porque juntas se pierden en silencio.
    // Orden por criticidad: primero lo que decide un precio o un cupo frente al
    // cliente (stock, 50% de EOL, apartados de preventa); los avisos y el
    // leaderboard pueden esperar.
    cargarInventarioNube();
    cargarEolNube();
    cargarApartadosNube();
    cargarPromosNube();
    cargarBundlesNube();
    cargarAvisosNube();
    cargarVentasNube();
  } finally { _refrescando = false; }
}

render();
actualizarBanner();
refrescarNube();
confirmarPuesto();

/* ---- Al volver a la app ----
   El asesor deja la PWA abierta y regresa horas (o días) después: sin esto ve
   el stock, las vigencias y el leaderboard del momento en que la abrió. */
const REFRESCO_MS = 5*60*1000;   // datos más viejos que esto se vuelven a pedir
const ESPERA_MIN_MS = 30*1000;   // ...pero nunca dos viajes al GAS tan seguidos

function alVolver(){
  if(document.visibilityState !== 'visible') return;
  const cambioDia = tocarDia();
  if(cambioDia){
    refiltrarCaches();   // vigencias al día aunque no haya red
    pintarUpdated();
    render();
  }
  if(Date.now() - _ultimoIntento < ESPERA_MIN_MS) return;
  if(cambioDia || Date.now() - _ultimaCarga > REFRESCO_MS) refrescarNube();
}
document.addEventListener('visibilitychange', alVolver);
window.addEventListener('focus', alVolver);

/* Si la app se recargó con un apartado a medio llenar, se vuelve a abrir sola.
   Sin esto el borrador existiría pero habría que acordarse de tocar «Apartar»
   en el mismo producto para verlo, y nadie lo sabría. */
(function(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(AP_BORRADOR)||'null'); }catch(e){}   // borrador ilegible = sin borrador, se abre en blanco
  if(!d || !d.sku) return;
  // Media hora, igual que continuidad.js: es la misma pregunta —«¿esto sigue
  // siendo lo que estaba haciendo?»— y dos plazos distintos confundirían.
  if(Date.now() - d.ts > 30*60*1000){ _apartBorradorTirar(); return; }
  if(!AP_CAMPOS.some(id => (d[id]||'').trim())) return;   // se abrió y no se escribió nada
  const inv = invBySku[d.sku] || {};
  abrirApartado(d.sku, encodeURIComponent(inv.producto||''), inv.precio||0);
})();
window.addEventListener('online', function(){ _ultimoIntento = 0; alVolver(); });

// ── Push notifications (OneSignal) ──────────────────────────────
const ONE_APP_ID = 'db32a1ef-d484-4be3-adfc-2a9e17f7e4f1';

/* El sitio NO vive en la raíz del dominio: está en
   github.io/tablero-hes1217/. Un service worker servido desde un subdirectorio
   no puede reclamar `/` — el navegador lo rechaza por seguridad— y con el scope
   mal `OneSignal.init()` falla entero.

   Eso es lo que tenía la campana muerta, y explica los CERO suscriptores del
   7-ago-2026: nadie pudo suscribirse nunca. El fallo no se veía porque lo
   recogía un `catch` con `console.warn`, que en un celular no lo lee nadie.

   Se deriva de la ruta en vez de escribirlo: así sigue funcionando si el repo
   cambia de nombre o si algún día se sirve desde la raíz. */
const ONE_BASE = location.pathname.replace(/[^/]*$/, '');   // '/tablero-hes1217/'
let _oneListo = false;
let _oneError = '';

function actualizarCampana(){
  const btn=document.getElementById('btnBell');
  if(!btn) return;
  /* Se mira la suscripción de OneSignal, NO `Notification.permission`.
     Son cosas distintas: el permiso lo da el navegador, la suscripción la
     registra OneSignal. Se puede tener permiso y no estar suscrito —justo lo
     que pasaba aquí— y entonces la campana decía "ya están activadas" mientras
     no llegaba ni un aviso. */
  let suscrito = false;
  try{
    suscrito = !!(window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription
                  && OneSignal.User.PushSubscription.optedIn);
  }catch(e){
    /* El SDK aún no terminó de cargar: se pinta como no suscrito, que es la
       lectura honesta hasta que conteste. */
  }
  btn.style.color = suscrito ? 'var(--rojo)' : '#ddd';
  btn.title = suscrito ? 'Avisos activados' : 'Activar avisos push';
}

async function activarNotifs(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)){
    alert('Este navegador no soporta avisos push.\n\nEn iPhone hay que abrir el tablero desde el ícono de la pantalla de inicio, no desde Safari.');
    return;
  }
  if(_oneError){
    // Antes esto se quedaba en console.warn y la campana parecía un ícono
    // muerto. Si algo falló, que se lea en el teléfono.
    alert('No se pudieron activar los avisos.\n\n' + _oneError);
    return;
  }
  if(!_oneListo){
    alert('Los avisos aún se están cargando. Espera unos segundos y vuelve a tocar la campana.');
    return;
  }
  if(Notification.permission === 'denied'){
    alert('Los avisos están BLOQUEADOS para esta página.\n\nHay que permitirlos desde los ajustes del navegador (candado junto a la dirección → Notificaciones → Permitir) y volver a tocar la campana.');
    return;
  }
  try{
    /* El permiso se pide al NAVEGADOR directamente, no a través del SDK.
       Con `OneSignal.Notifications.requestPermission()` el diálogo no llegaba a
       aparecer nunca: el permiso se quedaba en `default` y Chrome ni siquiera
       listaba el sitio en sus ajustes de Notificaciones — señal de que la
       petición no le llegó. (7-ago-2026, diagnosticado con los datos que ahora
       muestra el propio mensaje de error.)

       `Notification.requestPermission()` es la API estándar y se llama DENTRO
       del gesto del clic, sin un solo `await` por delante: los navegadores
       descartan la petición si el gesto ya se consumió. Por eso esta línea va
       la primera de todo el bloque. */
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){
      alert(permiso === 'denied'
        ? 'Bloqueaste los avisos. Para activarlos: candado junto a la dirección → Permisos → Notificaciones → Permitir.'
        : 'El navegador no llegó a preguntar.\n\nSi usas Chrome, entra en ⋮ → Configuración → Notificaciones y desactiva "Usar mensajes más discretos". Otra opción que casi siempre funciona: añade el tablero a la pantalla de inicio (⋮ → Añadir a pantalla principal) y ábrelo desde ahí.');
      return;
    }
    // Conceder el permiso NO suscribe: hay que darse de alta explícitamente. Sin
    // esta línea el navegador dice "permitido" y OneSignal sigue sin
    // destinatarios, que es el estado en el que estaba todo el equipo.
    if(OneSignal.User && OneSignal.User.PushSubscription){
      await OneSignal.User.PushSubscription.optIn();
    }
    actualizarCampana();
    const ok = !!(OneSignal.User && OneSignal.User.PushSubscription
                  && OneSignal.User.PushSubscription.optedIn);
    if(ok){ alert('✅ Avisos activados. Ya te van a llegar las novedades del tablero.'); return; }

    /* "No quedó activado" a secas no sirve para nada: hay tres motivos posibles
       y desde fuera no se distinguen. Así que el mensaje LOS DICE.
       (7-ago-2026: se perdió una hora probando a ciegas por no tener esto.) */
    // `permiso` ya viene de arriba, del requestPermission(). Se relee del
    // navegador por si cambió durante el alta de OneSignal.
    const permisoAhora = ('Notification' in window) ? Notification.permission : 'no soportado';
    let regs = [];
    try{
      regs = (await navigator.serviceWorker.getRegistrations()).map(r => r.scope);
    }catch(e){ regs = ['(no se pudieron leer)']; }
    const subId = (OneSignal.User && OneSignal.User.PushSubscription
                   && OneSignal.User.PushSubscription.id) || '(ninguno)';

    let pista = '';
    if(permisoAhora === 'denied')       pista = 'El navegador tiene BLOQUEADAS las notificaciones para esta página. Hay que permitirlas en los ajustes del sitio.';
    else if(permisoAhora === 'default') pista = 'El permiso se perdió a mitad del alta. Vuelve a tocar la campana.';
    else if(!regs.some(s => s.indexOf('tablero-hes1217') >= 0))
                                   pista = 'El service worker no está registrado en la ruta correcta. Hay que borrar los datos del sitio y volver a entrar.';
    else                           pista = 'Permiso concedido y service worker en su sitio, pero OneSignal no completó el alta.';

    alert('No quedó activado.\n\n' + pista +
          '\n\n— — — datos para diagnóstico — — —' +
          '\npermiso: ' + permiso +
          '\nsuscripción: ' + subId +
          '\nservice workers: ' + (regs.join(' | ') || 'ninguno'));
  }catch(e){
    alert('No se pudieron activar los avisos.\n\n' + ((e && e.message) || e));
  }
}

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  if(ONE_APP_ID==='TU_APP_ID_AQUI') return;
  try{
    await OneSignal.init({
      appId: ONE_APP_ID,
      // Ruta DESDE LA RAÍZ del dominio, que es como la espera OneSignal, y
      // scope limitado al subdirectorio donde de verdad vive el sitio.
      serviceWorkerPath: (ONE_BASE + 'sw.js').replace(/^\//, ''),
      serviceWorkerParam: { scope: ONE_BASE },
      notifyButton: { enable: false }
    });
    _oneListo = true;
  }catch(e){
    _oneError = (e && e.message) || String(e);
    console.warn('OneSignal init falló:', e);
  }
  actualizarCampana();
});

actualizarCampana();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(()=>{});
}
</script>
